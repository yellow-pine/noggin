# The site (docs/adr/0009): the repo's Markdown as it is, built by MkDocs Material; the pages workflow adds the web
# viewer at viewer/ and the README's pictures at images/ (make site). same-dir lets the docs be the repo itself (README.md is the home page).
site_name: noggin
site_url: https://yellowpine.com/noggin/
repo_url: https://github.com/yellow-pine/noggin
edit_uri: edit/main/
docs_dir: .
site_dir: site
theme:
  name: material
  custom_dir: overrides   # main.html: the pinned Mermaid below
hooks:
  - mermaid.py   # fetches, checks and copies the pinned Mermaid into the site
# the Mermaid the site serves instead of Material's floating unpkg mermaid@11, and the one test_site.py renders every
# diagram with (in the mermaid-cli below); the integrity is the sha384 of the npm package's dist/mermaid.min.js, which
# mermaid.py checks; CI caches both by these versions (check.yml)
extra:
  mermaid:
    version: 11.17.2
    integrity: sha384-EOXBFmc3gx5mb+vn0vPvvGqACToJD24hhacX5Yx+8NUUQrHIle/Qi5Bg9o3zKwW2
    cli: 11.17.1
plugins:
  - search
  - same-dir
  # numbers from the code (macros.py), on the pages listed only; their Jinja sits in HTML comments, which GitHub hides,
  # so the Markdown reads as prose there; an undefined name fails the build
  - macros:
      module_name: macros
      render_by_default: false
      force_render_paths: |
        /README.md
        /docs/model-notes.md
      on_undefined: strict
      j2_variable_start_string: "<!--{{"
      j2_variable_end_string: "}}-->"
      j2_block_start_string: "<!--{%"
      j2_block_end_string: "%}-->"
      j2_comment_start_string: "<!--{#"
      j2_comment_end_string: "#}-->"
# everything but the hand-written docs and their pictures (and the theme's own files, which this applies to as well);
# docs/references is the designer's files, local only
exclude_docs: |
  *
  !/*.md
  !/docs/**
  !/assets/**
  /docs/references/
  /CLAUDE.md
markdown_extensions:   # the Mermaid diagrams (README, docs/how-it-works.md), as Material documents it
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
  nav:
    not_found: info   # viewer/ is no Markdown: the workflow copies the viewer there
nav:
  - Home: README.md
  - How it works: docs/how-it-works.md
  - Build notes: docs/build-notes.md
  - Model notes: docs/model-notes.md
  - Face design: docs/face-design.md
  - Decisions:
      - docs/adr/0001-gestures-live-on-the-core.md
      - docs/adr/0002-replace-stock-program-never-firmware.md
      - docs/adr/0003-noggin-service-owns-the-link.md
      - docs/adr/0004-one-design-per-stage.md
      - docs/adr/0005-wifi-first-usb-fallback.md
      - docs/adr/0006-python-simulation-engine.md
      - docs/adr/0007-mujoco-engine.md
      - docs/adr/0008-web-viewer.md
      - docs/adr/0009-sources-only.md
  - Glossary: GLOSSARY.md
  - Contributing: CONTRIBUTING.md
  - Web viewer: viewer/
