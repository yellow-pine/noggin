# The site (docs/adr/0009): the repo's Markdown as it is, built by MkDocs Material, and the web viewer's page at viewer/;
# the pages workflow adds the viewer's GLBs and three.js beside it and the pictures at images/ (make site). same-dir
# lets the docs be the repo itself; home.py makes docs/index.md the home page, and the README, for contributors, stays
# on GitHub.
site_name: noggin
site_url: https://yellowpine.com/noggin/
repo_url: https://github.com/yellow-pine/noggin
edit_uri: edit/main/
docs_dir: .
site_dir: site
theme:
  name: material
  custom_dir: overrides   # main.html: the pinned Mermaid below, the fonts and the web viewer; viewer.html: its page
  font: false   # no page asks Google Fonts for Roboto: the site serves its own (fonts.py), no third-party request
  # the Mech's own colours (palette.py), light and dark, following the reader's system until they toggle
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
extra_css:
  - assets/stylesheets/layout.css   # layout only (#293)
hooks:
  - mermaid.py   # fetches, checks and copies the pinned Mermaid into the site
  - fonts.py   # and Roboto and Roboto Mono
  - home.py
  - palette.py   # the palette's CSS from the model's colours
  - web/page.py   # the web viewer's page (web/viewer.md) at viewer/
# the Mermaid the site serves instead of Material's floating unpkg mermaid@11, and the one test_site.py renders every
# diagram with (in the mermaid-cli below); the integrity is the sha384 of the npm package's dist/mermaid.min.js, which
# mermaid.py checks; CI caches both by these versions (check.yml)
extra:
  mermaid:
    version: 11.17.2
    integrity: sha384-EOXBFmc3gx5mb+vn0vPvvGqACToJD24hhacX5Yx+8NUUQrHIle/Qi5Bg9o3zKwW2
    cli: 11.17.1
plugins:
  - search
  - same-dir
  - redirects:   # pages that moved keep their old URLs
      redirect_maps:
        docs/build-notes.md: docs/build/stage-1.md
  # numbers from the code (macros.py), on the pages listed only; their Jinja sits in HTML comments, which GitHub hides,
  # so the Markdown reads as prose there; an undefined name fails the build
  - macros:
      module_name: macros
      render_by_default: false
      force_render_paths: |
        /docs/index.md
        /docs/use/gestures.md
        /docs/build/stage-*.md
        /docs/model-notes.md
      on_undefined: strict
      j2_variable_start_string: "<!--{{"
      j2_variable_end_string: "}}-->"
      j2_block_start_string: "<!--{%"
      j2_block_end_string: "%}-->"
      j2_comment_start_string: "<!--{#"
      j2_comment_end_string: "#}-->"
# everything but the hand-written docs and their pictures (and the theme's own files, which this applies to as well);
# docs/references is the designer's files, local only
exclude_docs: |
  *
  !/*.md
  !/docs/**
  !/assets/**
  /docs/references/
  # no real photo of the Mech on the site until there are staged ones (Cansin, 2026-11-01)
  *.jpg
  *.jpeg
  *.heic
  /CLAUDE.md
  /README.md
# the Mermaid diagrams (docs/how-it-works.md) as Material documents them; the landing page's grid cards and buttons
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
  nav:
    not_found: info   # reports/ is no Markdown: the workflow copies the reports there
nav:
  - Home: docs/index.md
  - Build:
      - Parts: docs/build/parts.md
      - "Stage 1: eyes": docs/build/stage-1.md
      - "Stage 2: neck": docs/build/stage-2.md
      - "Stage 3: mouth": docs/build/stage-3.md
      - Wiring: docs/build/wiring.md
      - Flashing: docs/build/flashing.md
      - Calibration: docs/build/calibration.md
      - Face (planned): docs/face-design.md
  - Use:
      - noggin service: docs/use/noggin-service.md
      - Hooks: docs/use/hooks.md
      - Gestures and behaviour: docs/use/gestures.md
      - Tuning: docs/use/tuning.md
  - Viewer: viewer.md
  - How it works: docs/how-it-works.md
  - Model:
      - Pictures: docs/pictures.md
      - Reports: reports/
      - Model notes: docs/model-notes.md
  - Reference:
      - Glossary: GLOSSARY.md
      - Decisions:
          - docs/adr/0001-gestures-live-on-the-core.md
          - docs/adr/0002-replace-stock-program-never-firmware.md
          - docs/adr/0003-noggin-service-owns-the-link.md
          - docs/adr/0004-one-design-per-stage.md
          - docs/adr/0005-wifi-first-usb-fallback.md
          - docs/adr/0006-python-simulation-engine.md
          - docs/adr/0007-mujoco-engine.md
          - docs/adr/0008-web-viewer.md
          - docs/adr/0009-sources-only.md
          - docs/adr/0010-one-version.md
      - Contributing: CONTRIBUTING.md
      - Credits: docs/credits.md
