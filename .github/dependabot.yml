version: 2
updates:   # PR titles are Conventional Commits with a scope (docs/adr/0010): every entry has `include: scope`, so
  # `build(deps|deps-dev): bump ...`, `ci(deps|deps-dev): bump ...`
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    cooldown:   # our pin rule: a release at least two weeks old (docs/research/2026-11-01-stack-alternatives.md)
      default-days: 14
    groups:
      uv:  # one weekly PR for patch and minor; majors stay their own PRs
        update-types: [minor, patch]
        patterns: ["*"]
      uv-security:  # every open security fix in one PR, majors too (version updates wait on cooldown, these never do)
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # They follow the Core's firmware, not upstream ([tool.noggin], eyes/test_micropython.py): bumped with
      # [tool.noggin] micropython when a vendor update changes the MicroPython the Core runs.
      - dependency-name: mpy-cross
      - dependency-name: "micropython-*"
  - package-ecosystem: npm   # the site (site/package.json, docs/adr/0013)
    directory: /site
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    cooldown:   # as above
      default-days: 14
    groups:
      npm:
        update-types: [minor, patch]
        patterns: ["*"]
      npm-security:  # as above
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm   # CI's tools (ci/package.json): the skills CLI the review and the weekly re-pin run
    directory: /ci
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    cooldown:   # as above
      default-days: 14
    groups:
      ci-tools:
        update-types: [minor, patch]
        patterns: ["*"]
      ci-tools-security:  # as above
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # 9.x until @semantic-release/release-notes-generator bundles conventional-changelog-writer 9+, which 10.x needs
      # (docs/adr/0017-semantic-release-from-main.md, ci/release.test.mjs); re-check: #536
      - dependency-name: conventional-changelog-conventionalcommits
        versions: [">= 10"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    cooldown:   # as above
      default-days: 14
    groups:
      github-actions:
        update-types: [minor, patch]
        patterns: ["*"]
      github-actions-security:  # as above
        applies-to: security-updates
        patterns: ["*"]
  # the CI images' sources (ci/*.Dockerfile FROM digests): main rebuilds :main once a bump lands (ci-images.yml); Node
  # stays on its major, Ubuntu moves LTS to LTS
  - package-ecosystem: docker
    directory: /ci
    schedule:
      interval: weekly
    cooldown:   # as above
      default-days: 14
    groups:
      # no update-types: a digest refresh of the same tag has none, and the only major left is Ubuntu's LTS move
      docker:
        patterns: ["*"]
    ignore:
      # LTS only (even-year .04): skip the interim releases between them (.10, odd-year .04), #352; extend past 30.04
      - dependency-name: ubuntu
        versions: [">= 24.05, < 26.04", ">= 26.05, < 28.04", ">= 28.05, < 30.04"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: ci
      include: scope
