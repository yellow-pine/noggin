version: 2
updates:   # PR titles are Conventional Commits (docs/adr/0010): `build: bump ...`, `ci: bump ...`
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      uv:  # one weekly PR for patch and minor; majors stay their own PRs
        update-types: [minor, patch]
        patterns: ["*"]
    ignore:
      # They match the Core's MicroPython ([tool.noggin], eyes/test_micropython.py), whose firmware is never reflashed.
      - dependency-name: mpy-cross
      - dependency-name: "micropython-*"
      # The MkDocs plugins wait for Astro Starlight to replace MkDocs; mkdocs-material keeps its patch and minor.
      - dependency-name: mkdocs-macros-plugin
      - dependency-name: mkdocs-redirects
      - dependency-name: mkdocs-same-dir
      - dependency-name: mkdocs-material
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        update-types: [minor, patch]
        patterns: ["*"]
