version: 2
updates:   # PR titles are Conventional Commits (docs/adr/0010): `build(deps|deps-dev): bump ...`, `ci(deps): bump ...`
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    cooldown:   # our pin rule: a release at least two weeks old (docs/research/2026-11-01-stack-alternatives.md)
      default-days: 14
    groups:
      uv:  # one weekly PR for patch and minor; majors stay their own PRs
        update-types: [minor, patch]
        patterns: ["*"]
    ignore:
      # They follow the Core's firmware, not upstream ([tool.noggin], eyes/test_micropython.py): bumped with
      # [tool.noggin] micropython when a vendor update changes the MicroPython the Core runs.
      - dependency-name: mpy-cross
      - dependency-name: "micropython-*"
  - package-ecosystem: npm   # the site (site/package.json, docs/adr/0012)
    directory: /site
    schedule:
      interval: weekly
    cooldown:   # as above
      default-days: 14
    commit-message:
      prefix: build
    groups:
      npm:
        update-types: [minor, patch]
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    cooldown:   # as above
      default-days: 14
    groups:
      github-actions:
        update-types: [minor, patch]
        patterns: ["*"]
  # the CI images' sources (ci/*.Dockerfile FROM digests): main builds the images once a bump lands, and the entry
  # below proposes them; Node stays on its major, Ubuntu moves LTS to LTS
  - package-ecosystem: docker
    directory: /ci
    schedule:
      interval: weekly
    cooldown:   # as above
      default-days: 14
    ignore:
      # LTS only (even-year .04): skip the interim releases between them (.10, odd-year .04), #352; extend past 30.04
      - dependency-name: ubuntu
        versions: [">= 24.05, < 26.04", ">= 26.05, < 28.04", ">= 28.05, < 30.04"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: ci
  # the jobs' container images (ghcr.io/yellow-pine/noggin-ci-*:main@sha256 in the workflows): the digests main's CI
  # Images run pushed (a Dockerfile change, the Monday rebuild), proposed for review like any other PR
  - package-ecosystem: docker
    directory: /.github/workflows
    schedule:   # no cooldown: our own build outputs, the weekly rebuild's security fixes
      interval: daily
    commit-message:
      prefix: ci
    groups:
      ci-images:
        patterns: ["*"]
