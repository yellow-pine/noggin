version: 2
updates:   # PR titles are Conventional Commits (docs/adr/0010): `build: bump ...`, `ci: bump ...`
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    cooldown:   # our pin rule: a release at least two weeks old (docs/research/2026-11-01-stack-alternatives.md)
      default-days: 14
    groups:
      uv:  # one weekly PR for patch and minor; majors stay their own PRs
        update-types: [minor, patch]
        patterns: ["*"]
    ignore:
      # They follow the Core's firmware, not upstream ([tool.noggin], eyes/test_micropython.py): bumped with
      # [tool.noggin] micropython when a vendor update changes the MicroPython the Core runs.
      - dependency-name: mpy-cross
      - dependency-name: "micropython-*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    cooldown:   # as above
      default-days: 14
    groups:
      github-actions:
        update-types: [minor, patch]
        patterns: ["*"]
  # the CI images' sources (ci/*.Dockerfile FROM digests): main builds the images once a bump lands, and the entry
  # below proposes them; Ubuntu and Node stay on their majors
  - package-ecosystem: docker
    directory: /ci
    schedule:
      interval: weekly
    cooldown:   # as above
      default-days: 14
    ignore:
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: ci
  # the jobs' container images (ghcr.io/yellow-pine/noggin-ci-*:main@sha256 in the workflows): the digests main's CI
  # Images run pushed (a Dockerfile change, the Monday rebuild), proposed for review like any other PR
  - package-ecosystem: docker
    directory: /.github/workflows
    schedule:   # no cooldown: our own build outputs, the weekly rebuild's security fixes
      interval: daily
    commit-message:
      prefix: ci
    groups:
      ci-images:
        patterns: ["*"]
