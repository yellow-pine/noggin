version: 2
updates:   # PR titles are Conventional Commits (docs/adr/0010): `build(deps|deps-dev): bump ...`, `ci(deps): bump ...`
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    cooldown:   # our pin rule: a release at least two weeks old (docs/research/2026-11-01-stack-alternatives.md)
      default-days: 14
    groups:
      uv:  # one weekly PR for patch and minor; majors stay their own PRs
        update-types: [minor, patch]
        patterns: ["*"]
    ignore:
      # They follow the Core's firmware, not upstream ([tool.noggin], eyes/test_micropython.py): bumped with
      # [tool.noggin] micropython when a vendor update changes the MicroPython the Core runs.
      - dependency-name: mpy-cross
      - dependency-name: "micropython-*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    cooldown:   # as above
      default-days: 14
    groups:
      github-actions:
        update-types: [minor, patch]
        patterns: ["*"]
