name: PR Checks
# Checks the PR's title is a Conventional Commit, its body links its issue, and it adds no vulnerable dependency.
# Main's copy of each script checks it (a PR can't loosen its own check). Required checks `PR Title` and `PR Issue` (the
# job names, which the ruleset matches); editing the title or body re-runs them.
# `PR Title`: the title is its squash commit, which release-please reads (docs/adr/0010): a Conventional Commit,
# `type(scope)[!]: subject`, of @commitlint/config-conventional's types and rules, with one scope derived from the repo
# (scripts/pr_title.py).
# `PR Issue`: the body links its issue (Closes #N, or Refs #N; scripts/pr_issue.py), so issue, PR and squash commit tie
# together (#356). A bot's PR (release-please, Dependabot, the skills and blender bumps) has no issue: it passes.
# `PR Issue` also runs GitHub's dependency review (actions/dependency-review-action): it fails a PR, a bot's too, that
# adds a dependency with a known vulnerability (#500). It reads the dependency graph's diff over the API: no checkout.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
concurrency:   # one run per PR; a new push or title/body edit cancels the one in progress
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  title:
    name: PR Title
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}   # main's script and folders: a PR can't loosen its own check
          persist-credentials: false
          sparse-checkout: scripts/pr_title.py   # git ls-files still lists every tracked file
          sparse-checkout-cone-mode: false
      - name: List the scopes
        id: scopes
        run: |
          { echo "scopes<<EOF"; python3 scripts/pr_title.py; echo EOF; } >> "$GITHUB_OUTPUT"
      - name: Check the title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50   # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          scopes: ${{ steps.scopes.outputs.scopes }}
          requireScope: true
          # config-conventional's subject-full-stop, and its subject-case (never sentence-, start-, pascal- or
          # upper-case), which fails exactly a subject whose first letter is a capital, a leading acronym or file name
          # too (#509): sentence-case is upperFirst(s) === s (commitlint v21.2.4's @commitlint/ensure/src/to-case.ts;
          # a subject not starting with a letter, `PR` in backticks say, is skipped by
          # @commitlint/rules/src/subject-case.ts). scripts/test_pr_title.py holds it to commitlint's verdicts.
          # shortcut: ASCII capitals only, a Unicode class needs the u flag the action doesn't set; upgrade if a title
          # ever starts with a non-ASCII letter
          subjectPattern: '^(?![A-Z]).*[^.]$'
          subjectPatternError: 'The subject "{subject}" must not start with an uppercase letter (put a leading acronym or file name in backticks) or end with a period.'
      - name: Check the scope and length
        # a bot's title is its own (Dependabot, release-please, the weekly bumps): it can't shorten it
        if: ${{ github.event.pull_request.user.type != 'Bot' }}
        env:   # via env, never inlined into the script
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/pr_title.py "$TITLE"
  issue:
    name: PR Issue
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write   # dependency review's summary comment on a failing PR
    steps:
      - name: Check out the script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}   # main's script: a PR can't loosen its own check
          persist-credentials: false
          sparse-checkout: scripts/pr_issue.py
          sparse-checkout-cone-mode: false
      - name: Check the body links an issue
        if: ${{ github.event.pull_request.user.type != 'Bot' }}
        env:
          BODY: ${{ github.event.pull_request.body }}   # via env, never inlined into the script
        run: python3 scripts/pr_issue.py <<<"$BODY"
      - name: Review the dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294   # v5.0.0
        with:
          fail-on-severity: low   # the action's default: any known vulnerability fails
          comment-summary-in-pr: on-failure   # a failing PR gets the findings as a comment (a 403 only warns)
