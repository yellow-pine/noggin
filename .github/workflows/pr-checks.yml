name: PR Checks
# Checks the PR's title is a Conventional Commit, its body links its issue, and it adds no vulnerable dependency.
# Main's copy of each script checks it (a PR can't loosen its own check). Required check `PR` (the job name, which the
# ruleset matches; one job since #496, its own workflow since it runs on edited, which Checks never does); editing the
# title or body re-runs it.
# The title is its squash commit, which release-please reads (docs/adr/0010): a Conventional Commit,
# `type(scope)[!]: subject`, of @commitlint/config-conventional's types and rules, with one scope derived from the repo
# (scripts/pr_title.py).
# The body links its issue (Closes #N, or Refs #N; scripts/pr_issue.py), so issue, PR and squash commit tie together
# (#356). A bot's PR (release-please, Dependabot, the skills and blender bumps) has no issue: it passes.
# GitHub's dependency review (actions/dependency-review-action) fails a PR, a bot's too, that adds a dependency with a
# known vulnerability (#500). It reads the dependency graph's diff over the API.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
concurrency:   # one run per PR; a new push or title/body edit cancels the one in progress
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pr:
    name: PR
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write   # dependency review's summary comment on a failing PR
    steps:
      - name: Check out the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}   # main's scripts and folders: a PR can't loosen its own check
          persist-credentials: false
          sparse-checkout: |   # git ls-files still lists every tracked file
            scripts/pr_title.py
            scripts/pr_issue.py
          sparse-checkout-cone-mode: false
      - name: List the scopes and the subject pattern
        id: title
        run: |
          { echo "scopes<<EOF"; python3 scripts/pr_title.py; echo EOF; } >> "$GITHUB_OUTPUT"
          echo "subject=$(python3 scripts/pr_title.py --subject-pattern)" >> "$GITHUB_OUTPUT"
      - name: Check the title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50   # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          scopes: ${{ steps.title.outputs.scopes }}
          requireScope: true
          # config-conventional's subject-case and subject-full-stop, from scripts/pr_title.py (its SUBJECT, why there),
          # which checks a title before a push with the same pattern (#548)
          subjectPattern: ${{ steps.title.outputs.subject }}
          subjectPatternError: 'The subject "{subject}" must not start with an uppercase letter (put a leading acronym or file name in backticks) or end with a period.'
      - name: Check the scope and length
        # a bot's title is its own (Dependabot, release-please, the weekly bumps): it can't shorten it
        if: ${{ github.event.pull_request.user.type != 'Bot' }}
        env:   # via env, never inlined into the script
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/pr_title.py "$TITLE"
      - name: Check the body links an issue
        if: ${{ !cancelled() && github.event.pull_request.user.type != 'Bot' }}   # past a failed title check too
        env:
          BODY: ${{ github.event.pull_request.body }}   # via env, never inlined into the script
        run: python3 scripts/pr_issue.py <<<"$BODY"
      - name: Review the dependencies
        if: ${{ !cancelled() }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294   # v5.0.0
        with:
          fail-on-severity: low   # the action's default: any known vulnerability fails
          comment-summary-in-pr: on-failure   # a failing PR gets the findings as a comment (a 403 only warns)
