name: PR Checks
# Checks the PR's title is a Conventional Commit, its body links its issue, and it adds no vulnerable dependency.
# Main's copy of each script checks it (a PR can't loosen its own check). Required check `PR` (the job name, which the
# ruleset matches; one job since #496, its own workflow since it runs on edited, which Checks never does); editing the
# title or body re-runs it.
# The title is its squash commit, which semantic-release reads (docs/adr/0010, 0017): a Conventional Commit,
# `type(scope)[!]: subject`, which commitlint checks against @commitlint/config-conventional's types and rules, with
# one scope derived from the repo (ci/commitlint.config.mjs).
# The body links its issue (Closes #N, or Refs #N; scripts/pr_issue.py), so issue, PR and squash commit tie together
# (#356). A bot's PR (Dependabot, the skills and blender bumps) has no issue: it passes.
# GitHub's dependency review (actions/dependency-review-action) fails a PR, a bot's too, that adds a dependency with a
# known vulnerability (#500). It reads the dependency graph's diff over the API.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
concurrency:   # one run per PR; a new push or title/body edit cancels the one in progress
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pr:
    name: PR
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write   # dependency review's summary comment on a failing PR
    steps:
      - name: Check out the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}   # main's scripts and folders: a PR can't loosen its own check
          persist-credentials: false
          sparse-checkout: |   # git ls-files still lists every tracked file
            ci/commitlint.config.mjs
            ci/package.json
            ci/package-lock.json
            scripts/pr_issue.py
          sparse-checkout-cone-mode: false
      # the runner's Node, npm's cache keyed on the lockfile
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          cache: npm
          cache-dependency-path: ci/package-lock.json
      - name: Install commitlint
        run: npm ci --prefix ci --ignore-scripts --no-audit --no-fund
      - name: Check the title
        env:   # via env, never inlined into the script
          TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}   # a bot's title is its own: no length limit
        run: ci/node_modules/.bin/commitlint --config ci/commitlint.config.mjs <<<"$TITLE"
      - name: Check the body links an issue
        if: ${{ !cancelled() && github.event.pull_request.user.type != 'Bot' }}   # past a failed title check too
        env:
          BODY: ${{ github.event.pull_request.body }}   # via env, never inlined into the script
        run: python3 scripts/pr_issue.py <<<"$BODY"
      - name: Review the dependencies
        if: ${{ !cancelled() }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294   # v5.0.0
        with:
          fail-on-severity: low   # the action's default: any known vulnerability fails
          comment-summary-in-pr: on-failure   # a failing PR gets the findings as a comment (a 403 only warns)
