name: Image Scan
# Scans the two CI images for known vulnerabilities weekly, into the Security tab; never a PR check.
# Grype (anchore/scan-action) reads ghcr.io/yellow-pine/noggin-ci-base and -blender at :main, what the jobs run
# (ci-images.yml), and uploads SARIF to code scanning, one category per image. Only findings with a fix are reported: the
# remedy is a base-image bump (Dependabot, ci/*.Dockerfile) or a rebuild (`gh workflow run ci-images.yml`).
run-name: "${{ github.event_name == 'schedule' && 'ci(ci): weekly Image Scan of the CI images' || format('ci(ci): manual Image Scan run by {0}', github.actor) }}"
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions: {}
jobs:
  scan:
    name: Scan (${{ matrix.image }})
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write   # the SARIF upload
    strategy:
      fail-fast: false
      matrix:
        image: [base, blender]
    steps:
      - name: Scan the image
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439   # v7.4.2
        with:
          image: ghcr.io/yellow-pine/noggin-ci-${{ matrix.image }}:main
          fail-build: false   # the Security tab tracks them
          only-fixed: true
      - name: Upload the findings
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370   # v4.39.1
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: image-${{ matrix.image }}
