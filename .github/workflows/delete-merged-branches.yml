name: delete merged branches
# Ticket branches never get a PR (they merge into an integration branch), so GitHub's
# "delete head branches" setting never sees them. On every push, delete any other branch
# that is fully contained in the pushed branch. Kept: main, branches with an open PR,
# parked work (face-*), and the pushed branch itself.
on: push
permissions:
  contents: write
  pull-requests: read
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          PUSHED: ${{ github.ref_name }}
        run: |
          open=$(gh pr list --state open --json headRefName -q '.[].headRefName')
          for b in $(git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin); do
            case "$b" in HEAD|main|face-*|"$PUSHED") continue;; esac
            if echo "$open" | grep -qx "$b"; then continue; fi
            if git merge-base --is-ancestor "origin/$b" "origin/$PUSHED"; then
              echo "deleting $b (merged into $PUSHED)"
              git push origin --delete "$b"
            fi
          done
