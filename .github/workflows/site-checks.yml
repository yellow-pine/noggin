name: Site Checks
# Builds and checks the site: the pictures in Blender, then the docs, viewer and reports, uploaded as an artifact.
# On PRs and on main (docs/adr/0009, #310): `Render` renders the README's pictures in Blender (make pictures, #226; one
# runner per motion, the matrix `Motions` reads from the code, #297; the required `Pictures` check sums them up) beside
# `Viewer`, whose GLBs Blender bakes and make web tests (docs/adr/0008) whenever what they are made from changed (#221);
# then `Site` gathers the pictures and Astro Starlight builds the docs (make site, docs/adr/0013) with them at
# site/dist/images, the viewer at site/dist/viewer and main's latest sim reports at site/dist/reports, tests the built
# site (Vitest) and plays the viewer and search in Chrome (Playwright), and uploads it as an artifact: a PR's preview,
# and on main what Site Deploy (pages.yml) deploys once this run and Code Checks passed. `Site` and `Pictures` are
# required checks on PRs that touch what the site is made from (the changes job, as for check.yml's mech); on a PR or
# main push whose pictures or viewer are cached from the same inputs, neither Blender job runs (#386, #471). On main,
# Deploy Pending (deploy-pending.yml) sets the commit's `deploy` status pending while this builds (#292); Site Deploy
# sets its outcome.
# render and viewer run in our Blender image, site in the base one (Chrome for the viewer's test; ci/, docs/adr/0009);
# the other jobs need no tool uv can't install.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:   # main's weekly full run (#471): no lookups or output caches, so every motion renders and the viewer bakes
    - cron: "0 7 * * 1"
concurrency:   # as check.yml's: one run per PR (or main), a new push cancels the one in progress; the weekly run apart
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
permissions: {}
jobs:
  # the PR's paths filtered as check.yml's; the keys' hash; and on a PR or main push the lookups. Main's Site always
  # runs (it builds the deploy), and the weekly run only hashes
  changes:
    name: Changes
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      site: ${{ steps.filter.outputs.site }}
      pictures: ${{ steps.pictures.outputs.cache-hit }}   # warm: the motions and render skip, site restores them
      viewer: ${{ steps.viewer.outputs.cache-hit }}   # warm: viewer skips, site restores it
      pictures-hash: ${{ steps.inputs.outputs.pictures }}
      viewer-hash: ${{ steps.inputs.outputs.viewer }}
    steps:
      - name: Filter the changed paths
        if: ${{ github.event_name == 'pull_request' }}
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d   # v4.0.3
        with:
          filters: |
            site: ["model/**", "eyes/**", "noggin/**", "reactions/**", "web/**", "docs/**", "**/*.md", "site/**", "Makefile", "pyproject.toml", "uv.lock",
                   ".github/workflows/*.yml", "ci/*.Dockerfile", "macros.py", "scripts/workflow_table.py"]
      # whether the pictures and the viewer built from the same inputs are cached: then neither Blender job runs, nor
      # pulls its image (~50 s on the critical path for a cache hit, #386). Their keys hash only what they are made
      # from (#469): the render code and the parts' make (model/ours.py) with what they import or name (the
      # trajectories' sources, the script Blender runs; scripts/inputs.py), Blender's pin and uv.lock, so a Makefile, workflow or test edit renders
      # nothing. Hashed here alone, on the runner's Python (the repo's syntax; the images' is older), for every job
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes
      - name: Hash the inputs
        id: inputs
        run: |   # each the inputs' sha256 and uv.lock's minus noggin's version, which a release bumps (#403)
          lock=$(python3 scripts/lock_hash.py)
          pictures=$(python3 scripts/inputs.py --hash model/render/pictures.py model/ours.py ci/blender.Dockerfile)
          viewer=$(python3 scripts/inputs.py --hash web/build.py model/ours.py ci/blender.Dockerfile)
          { echo "pictures=$pictures-$lock"; echo "viewer=$viewer-$lock"; } >> "$GITHUB_OUTPUT"
      - name: Look up the cached pictures
        if: ${{ github.event_name != 'schedule' }}
        id: pictures
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/images
          key: pictures-${{ steps.inputs.outputs.pictures }}
          lookup-only: true
      - name: Look up the cached viewer
        if: ${{ github.event_name != 'schedule' }}
        id: viewer
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: web/build
          key: viewer-${{ steps.inputs.outputs.viewer }}
          lookup-only: true
  # render's matrix from the code (make pictures-list, model/render/pictures.py SITE): a new motion needs no edit here
  motions:
    name: Motions
    needs: changes
    if: >-   # as site, unless every picture is cached (render then skips too)
      ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.site != 'false'
      && needs.changes.outputs.pictures != 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3
        with:
          enable-cache: false   # as in check.yml
      - name: List the motions
        id: list
        run: |   # its own assignment, so a failing make fails the step
          list=$(make -s pictures-list)
          echo "list=$list" >> "$GITHUB_OUTPUT"
  # every deploy replaces the whole site, so every run has the pictures: rendered when what they are made from changed,
  # else the last ones rendered from the same inputs (a docs-only change renders nothing). One runner per motion, which
  # renders and encodes it (on CI's software GL, each frame's seconds in its log, #470), and the site job gathers them
  render:
    name: Render (${{ matrix.motion }})
    needs: [changes, motions]
    if: ${{ !cancelled() && needs.motions.result == 'success' }}
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/yellow-pine/noggin-ci-blender:main   # as check.yml's code
    strategy:
      fail-fast: false   # every motion runs to its end; site fails unless all of them succeeded
      matrix:
        include: ${{ fromJSON(needs.motions.outputs.list) }}   # {motion, stages} (test_site.py)
    permissions:
      contents: read
      actions: read   # scripts/ci_budget.py reads the run's start
    outputs:
      cold: ${{ steps.cold.outputs.cold }}   # set by a runner that rendered (an empty output is never set)
    env:   # only the Stages a motion draws are baked (make trajectories)
      TRAJ_DOCS: ${{ matrix.stages }}
      MESA_SHADER_CACHE_DIR: /tmp/mesa-shader-cache   # cached below
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; the token stays out of what is uploaded
      - name: Hash the lockfile
        id: lock
        run: |   # uv.lock minus noggin's version, which a release bumps (#403); a failing script fails the step
          hash=$(python3 scripts/lock_hash.py)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      # this motion's pictures (model/build/images)
      - name: Restore this motion's pictures
        if: ${{ github.event_name != 'schedule' }}   # the weekly run renders every motion again
        id: frames
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/images
          key: images-${{ matrix.motion }}-${{ needs.changes.outputs.pictures-hash }}
      # our built parts and the latest trajectories, as in viewer (whose make web then finds these trajectories fresh); the
      # trajectories need no convex pieces (mjcf.model collide=False: no CoACD on this path, #276)
      - name: Restore the parts cache
        if: ${{ steps.frames.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ours-convex-${{ hashFiles('model/printed/**', 'model/render/scene.py', 'model/envelopes.py', 'model/fits.py', 'model/geometry.py', 'model/linkage.py', 'model/ours.py', 'model/mjcf.py', 'model/stages.py') }}-${{ steps.lock.outputs.hash }}
          restore-keys: ours-convex-
      - name: Restore the trajectories
        if: ${{ steps.frames.outputs.cache-hit != 'true' }}
        id: trajectories
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/trajectories
          key: trajectories-${{ hashFiles('model/**', '!model/build/**', 'eyes/**') }}-${{ steps.lock.outputs.hash }}
          restore-keys: trajectories-
      # llvmpipe's compiled shaders, so Blender's first frame does not compile Eevee's again (~10-20 s, #470); Mesa checks
      # each entry against its own build, so an older cache only misses
      - name: Restore Mesa's shader cache
        if: ${{ steps.frames.outputs.cache-hit != 'true' }}
        id: mesa
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: /tmp/mesa-shader-cache
          key: mesa-${{ matrix.motion }}-${{ hashFiles('model/render/blender.py', 'ci/blender.Dockerfile') }}
          restore-keys: mesa-${{ matrix.motion }}-
      # its own step first, so the run's timings show the bake apart from the renders
      - name: Run make trajectories
        if: ${{ steps.frames.outputs.cache-hit != 'true' }}
        run: make trajectories
      # the trajectories cache is saved by viewer, whose key covers theirs and whose make web bakes every Stage
      - name: Run make pictures
        if: ${{ steps.frames.outputs.cache-hit != 'true' }}
        id: cold
        env:
          MOTIONS: ${{ matrix.motion }}
        run: |
          make pictures BLENDER=blender
          echo "cold=true" >> "$GITHUB_OUTPUT"
      - name: Save Mesa's shader cache
        if: ${{ steps.frames.outputs.cache-hit != 'true' && steps.mesa.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: /tmp/mesa-shader-cache
          key: ${{ steps.mesa.outputs.cache-primary-key }}
      - name: Save this motion's pictures
        if: ${{ steps.frames.outputs.cache-hit != 'true' && github.event_name != 'schedule' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/images
          key: ${{ steps.frames.outputs.cache-primary-key }}
      - name: Upload the pictures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: images-${{ matrix.motion }}
          path: model/build/images
          if-no-files-found: error
      - name: Check the CI budget
        run: python3 scripts/ci_budget.py ${{ steps.frames.outputs.cache-hit == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
  # the required check (#245), motions and render's runners under one name (as check.yml's model); both skipped passes
  pictures:
    name: Pictures
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    needs: [motions, render]
    runs-on: ubuntu-26.04
    steps:
      - name: Check every runner passed
        env:
          RESULTS: ${{ needs.motions.result }} ${{ needs.render.result }}
        run: for r in $RESULTS; do test "$r" = success || test "$r" = skipped || exit 1; done
  # the viewer's GLBs (Blender's, in web/build) built and tested by make web when what they are made from changed, else
  # the last ones built from the same inputs: a docs-only change bakes nothing. Beside the pictures, so neither waits
  # for the other (#278)
  viewer:
    name: Viewer
    needs: changes
    if: >-   # as site, unless the viewer is cached
      ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.site != 'false'
      && needs.changes.outputs.viewer != 'true' }}
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/yellow-pine/noggin-ci-blender:main   # as check.yml's code
    permissions:
      contents: read
      actions: read   # scripts/ci_budget.py reads the run's start
    outputs:
      warm: ${{ steps.viewer.outputs.cache-hit == 'true' || steps.trajectories.outputs.cache-hit == 'true' }}   # GLBs bake in ~40 s
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; the token stays out of what is uploaded
      - name: Hash the lockfile
        id: lock
        run: |   # uv.lock minus noggin's version, which a release bumps (#403); a failing script fails the step
          hash=$(python3 scripts/lock_hash.py)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - name: Restore the viewer
        if: ${{ github.event_name != 'schedule' }}   # the weekly run bakes the viewer again
        id: viewer
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: web/build
          key: viewer-${{ needs.changes.outputs.viewer-hash }}
      # the check workflow's cache of our built parts (same key: its model job fills it); restore only, since a save here
      # would store the key without model/build/convex first and the check workflow's full save would be refused;
      # restore-keys as in check.yml: a part's own .key rebuilds only what changed. The latest trajectories: make web
      # rebakes only the Stages whose stamp moved (model/trajectories.py)
      - name: Restore the parts cache
        if: ${{ steps.viewer.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ours-convex-${{ hashFiles('model/printed/**', 'model/render/scene.py', 'model/envelopes.py', 'model/fits.py', 'model/geometry.py', 'model/linkage.py', 'model/ours.py', 'model/mjcf.py', 'model/stages.py') }}-${{ steps.lock.outputs.hash }}
          restore-keys: ours-convex-
      - name: Restore the trajectories
        if: ${{ steps.viewer.outputs.cache-hit != 'true' }}
        id: trajectories
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/trajectories
          key: trajectories-${{ hashFiles('model/**', '!model/build/**', 'eyes/**') }}-${{ steps.lock.outputs.hash }}
          restore-keys: trajectories-
      - name: Run make web
        if: ${{ steps.viewer.outputs.cache-hit != 'true' }}
        run: make web BLENDER=blender
      # saved even when a web test fails, as check.yml saves the parts: the baked trajectories stay good
      - name: Save the trajectories
        if: ${{ always() && steps.viewer.outputs.cache-hit != 'true' && steps.trajectories.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/trajectories
          key: ${{ steps.trajectories.outputs.cache-primary-key }}
      - name: Save the viewer
        if: ${{ steps.viewer.outputs.cache-hit != 'true' && github.event_name != 'schedule' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: web/build
          key: ${{ steps.viewer.outputs.cache-primary-key }}
      - name: Upload the viewer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: viewer
          path: web/build
          if-no-files-found: error
      - name: Check the CI budget
        run: python3 scripts/ci_budget.py ${{ steps.viewer.outputs.cache-hit == 'true' || steps.trajectories.outputs.cache-hit == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
  site:
    name: Site
    needs: [changes, render, viewer]
    if: >-   # as check.yml's mech
      ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.site != 'false' }}
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/yellow-pine/noggin-ci-base:main   # as check.yml's code
      env:
        UV_CACHE_DIR: /__w/uv-cache   # as check.yml's code: uv sync hard-links make site's venv, copying it took ~25 s (#386)
        UV_LINK_MODE: hardlink
      options: --ipc=host   # Chrome's shared memory (https://playwright.dev/docs/docker)
    permissions:
      contents: read
      actions: read   # scripts/ci_budget.py reads when the run's jobs started
    steps:
      # never a site without all its pictures and its viewer: the deploy would take them down (as on #236's first deploy);
      # a job skipped as warm (changes) leaves them to the restores below, which fail on a miss
      - name: Require the pictures and viewer
        if: >-
          ${{ needs.render.result != 'success' && needs.changes.outputs.pictures != 'true'
          || needs.viewer.result != 'success' && needs.changes.outputs.viewer != 'true' }}
        run: exit 1
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; the token stays out of what is uploaded
      # every motion's pictures (model/build/images, which make site puts at site/dist/images): the last ones rendered
      # from the same inputs, else render's, saved here all together for changes to find
      - name: Restore the pictures
        id: images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/images
          key: pictures-${{ needs.changes.outputs.pictures-hash }}
          fail-on-cache-miss: ${{ needs.changes.outputs.pictures == 'true' }}
      - name: Download the pictures
        if: ${{ steps.images.outputs.cache-hit != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          pattern: images-*
          merge-multiple: true
          path: model/build/images
      # the viewer's GLBs (web/build): viewer's, or the cached ones it skipped for
      - name: Download the viewer
        if: ${{ needs.changes.outputs.viewer != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: viewer
          path: web/build
      - name: Restore the viewer
        if: ${{ needs.changes.outputs.viewer == 'true' }}
        id: viewer
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: web/build
          key: viewer-${{ needs.changes.outputs.viewer-hash }}
          fail-on-cache-miss: true
      # Node by site/.nvmrc, npm's cache keyed on the lockfile (make site runs npm ci)
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      # main's latest sim reports (check.yml's sim shard saves them on main), which make site publishes at /reports: no
      # entry carries this key, so the newest sim- entry is restored. This runs beside Code Checks, so on main Site
      # Deploy swaps in the newest once Code Checks is done (make site-reports)
      - name: Restore main's sim reports
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/reports
          key: sim-latest
          restore-keys: sim-
      - name: Run make site
        run: make site
      # the built site's HTML: pages, links, numbers, CSP; and the diagrams drawn by mermaid-cli in the image's Chrome
      - name: Test the built site
        run: npm --prefix site test
      # the viewer plays a gesture, search finds a page, diagrams draw, in Chrome (the image's), with no CSP violation
      # and no request to another host but api.github.com
      - name: Smoke-test the site in Chrome
        run: npm --prefix site run smoke
      # the PR's preview, and on main what Site Deploy deploys (actions/download-artifact by this run's id)
      - name: Upload the site
        id: preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: site
          path: site/dist
          include-hidden-files: true   # as upload-pages-artifact would take them
          if-no-files-found: error
      - name: Upload the pictures
        if: ${{ github.event_name == 'pull_request' }}
        id: pictures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: pictures
          path: model/build/images
      - name: Link the preview
        if: ${{ github.event_name == 'pull_request' }}
        env:
          URL: ${{ steps.preview.outputs.artifact-url }}
          PICTURES: ${{ steps.pictures.outputs.artifact-url }}
          BUILT: ${{ needs.render.outputs.cold == 'true' && 'rendered from this PR' || 'unchanged, the last build of the same inputs' }}
        run: |
          echo "Site preview with the web viewer: [the site artifact]($URL)," >> "$GITHUB_STEP_SUMMARY"
          echo 'unzip it into a folder named noggin and run `python -m http.server` beside it, then open' >> "$GITHUB_STEP_SUMMARY"
          echo 'http://localhost:8000/noggin/ (the site lives under /noggin/).' >> "$GITHUB_STEP_SUMMARY"
          echo "Pictures ($BUILT): [the pictures artifact]($PICTURES), what the site serves at images/ once this lands." >> "$GITHUB_STEP_SUMMARY"
      # a Docs version's build, as release.yml makes each release's (docs/adr/0014): the same site under /noggin/v0.0/,
      # its links inside it (dist is rebuilt here, after its upload)
      - name: Test a docs version build
        run: npm --prefix site run build && npm --prefix site test
        env:
          SITE_BASE: /noggin/v0.0
      # as in check.yml; warm: no motion of the pictures rendered and the viewer was warm or skipped as cached (the
      # budget's critical path runs through render or viewer to here)
      - name: Check the CI budget
        run: >-
          python3 scripts/ci_budget.py ${{ needs.render.outputs.cold != 'true'
          && (needs.viewer.outputs.warm == 'true' || needs.changes.outputs.viewer == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
