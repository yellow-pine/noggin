name: Blender Updates
# Re-pins Blender to the newest stable release at least 14 days old and opens (or refreshes) a PR, weekly.
# scripts/blender_pin.py (#334) rewrites the version and the Linux tarball's sha256 wherever the pin lives. It acts as
# the bot App (CONTRIBUTING.md): a PR opened with GITHUB_TOKEN starts no workflows
# (https://docs.github.com/en/actions/concepts/security/github_token).
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
concurrency:   # the newest run wins: it re-pins from scratch
  group: ${{ github.workflow }}
  cancel-in-progress: true
permissions: {}
jobs:
  pin:
    name: Re-pin Blender
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Find the newest Blender
        id: pin
        # its own assignment, so a failed fetch or a hash the sources disagree on fails the step (inside echo's
        # arguments it would pass as "no change")
        run: |
          out=$(python3 scripts/blender_pin.py)
          echo "version=${out%% *}" >> "$GITHUB_OUTPUT"
          echo "sources=${out#* }" >> "$GITHUB_OUTPUT"
      # from main only (a dispatch elsewhere is a dry run): it would otherwise propose that branch's commits too
      - name: Mint the bot App's token
        id: app
        if: ${{ github.ref == 'refs/heads/main' && steps.pin.outputs.version != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510   # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write   # its own branch
          permission-pull-requests: write
      - name: Open or refresh the PR
        if: ${{ github.ref == 'refs/heads/main' && steps.pin.outputs.version != '' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.pin.outputs.version }}
          SOURCES: ${{ steps.pin.outputs.sources }}
        run: |
          title="ci(deps): re-pin Blender to $VERSION"
          body="Blender $VERSION, the newest stable release at least 14 days old; sha256 from its .sha256, the same on each of: $SOURCES (Blender signs no checksums; compare https://download.blender.org/release/Blender${VERSION%.*}/blender-$VERSION.sha256). Release notes: https://www.blender.org/download/releases/$(echo "${VERSION%.*}" | tr . -)/"
          git switch -C blender-bump
          git -c core.hooksPath=/dev/null -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qam "$title"
          # force: blender-bump is this workflow's own branch, rebuilt from main each run, and the only ref it writes
          git -c core.hooksPath=/dev/null push -qf "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" blender-bump
          gh pr create --head blender-bump --title "$title" --body "$body" || gh pr edit blender-bump --title "$title" --body "$body"
