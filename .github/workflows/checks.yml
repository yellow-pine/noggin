name: Checks
# Runs `just check`, the model tests with the Mech stand-in, sim and STL/STEP export, and builds the site.
# One workflow, one required check (#496): `Checks`, the gate every other job here leads into. On PRs, on main
# (docs/adr/0009, #310), weekly and on any branch on demand (#562). `Changes` is the one fan-out: what the PR (its
# files from the API) or main's push
# (by git, against main's last commit whose Checks passed, #471) touches (dorny/paths-filter), the parts' cache looked
# up, and from the code the model shards (just model-shards-list); work whose inputs did not change is skipped, which
# the gate counts as passing. `Code` runs
# just check; `Model` the tests marked model in four shards balanced on the seconds they measured (model/shards.py: the
# hero's collision sweep, each document, the rest with just view's offscreen render, just sim when its inputs changed,
# and just mech, the Link's live checks on the Mech stand-in, #222), with just stl and just step on main or when the
# parts changed; a cold parts cache is built and cut first (`Convex`, #223) and saved, so the shards start warm. Every
# artifact of a public repo is anyone's, so nothing derived from today's printed parts is rendered or uploaded (#640,
# docs/adr/0019) and the parts pass between jobs in the Actions cache alone. `Blender` renders the next Mech alone (#649):
# its panels, its eye gimbal in motion and a picture per part (just pictures next) and its viewer GLBs (just web
# next), when what they are made from changed. `Site` builds the docs
# (just site, docs/adr/0013) with main's latest sim reports and tests the built HTML; `Checks` adds the next Mech's
# pictures and GLB, tests and plays the site in Chrome (Playwright), uploads it (a PR's preview, and on main what Site
# Deploy, pages.yml, deploys) and checks the CI budget once (scripts/ci_budget.py). On main, Deploy
# Pending (deploy-pending.yml) sets the commit's `deploy` status pending while this builds (#292); Site Deploy sets its
# outcome. Code and Site run in our base image, Blender in our Blender image; the others on the bare runner.
on:
  push:
    branches: [main]
  pull_request:   # never on edited: a title or body edit would cancel this run, or green a red one (#496)
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:   # main's weekly full run (#471): no filters or output lookups, so every check runs, the filters' safety net
    - cron: "0 7 * * 1"
  # the same full run on any branch, on demand (#562): every check runs, so the Checks it posts on the branch's head
  # are a real one
  workflow_dispatch:
concurrency:   # one run per PR (or main): a new push cancels the one in progress, main runs its latest; the weekly run
  # has its own group, so it neither cancels a push's run (which Site Deploy waits for) nor is cancelled
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read   # scripts/ci_budget.py reads when the run's jobs started
defaults:
  run:
    shell: bash   # -eo pipefail: just's exit code survives the tee
jobs:
  changes:
    name: Changes
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
      actions: read   # main's last checked commit
    outputs:
      model: ${{ steps.filter.outputs.model }}
      # main's Site always runs: it builds the deploy
      site: ${{ github.event_name != 'pull_request' || steps.filter.outputs.site == 'true' }}
      parts: ${{ steps.parts.outputs.cache-hit }}   # warm: convex skips
      parts-key: ${{ steps.parts.outputs.cache-primary-key }}
      next: ${{ steps.next.outputs.cache-hit }}   # warm: Blender skips, checks restores them
      next-hash: ${{ steps.inputs.outputs.next }}
      shards: ${{ steps.lists.outputs.shards }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes
      # a push diffs against main's last commit whose push run here passed, not the one before it: a newer push
      # cancels the run in progress, and that commit's changes are then checked in the next run (#471). None: the
      # commit before the push (an empty base)
      - name: Find main's last checked commit
        if: ${{ github.event_name == 'push' }}
        id: checked
        run: |   # its own assignment, so a failing gh fails the step
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/checks.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Filter the changed paths
        if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d   # v4.0.3
        with:   # mech: the justfile's MicroPython tag, pyproject's mpy-cross pin; model: test_derived.py's MADE_FROM says why
          base: ${{ steps.checked.outputs.sha }}   # a PR's: its base branch, from the API
          filters: |
            mech: ["eyes/**", "noggin/**", "reactions/**", "mech/**", "model/geometry.py", "justfile", "pyproject.toml", ".github/workflows/checks.yml"]
            model: ["model/**", "eyes/**", "conftest.py", "scripts/heavy.py", "scripts/inputs.py", "pyproject.toml", "uv.lock", ".python-version", "justfile", ".github/workflows/checks.yml"]
            site: ["model/**", "eyes/**", "noggin/**", "reactions/**", "web/**", "docs/**", "**/*.md", "site/**", "justfile", "pyproject.toml", "uv.lock",
                   ".github/workflows/*.yml", "ci/*.Dockerfile", "macros.py", "scripts/workflow_table.py"]
      # the next Mech's pictures' and GLB's key hashes only what they are made from (#469): the render code and the
      # parts' make (model/ours.py) with what they import or name (scripts/inputs.py), Blender's pin and uv.lock, so a
      # justfile, workflow or test edit renders nothing. Hashed here alone, on the runner's Python, for every job
      - name: Hash the next Mech's inputs
        id: inputs
        run: |   # the inputs' sha256
          next=$(python3 scripts/inputs.py --hash model/render/pictures.py web/build.py model/ours.py ci/blender.Dockerfile uv.lock)
          echo "next=$next" >> "$GITHUB_OUTPUT"
      # whether the next Mech's pictures and GLB made from the same inputs are cached: then Blender skips, nor pulls
      # its image (#386). The weekly and dispatched runs render again
      - name: Look up the next Mech's pictures
        if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
        id: next
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/images
            web/build
          key: next-${{ steps.inputs.outputs.next }}
          lookup-only: true
      # our built parts and their convex pieces: a hit starts the model shards warm, a miss runs convex first
      - name: Look up the parts cache
        id: parts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ours-convex-${{ hashFiles('model/printed/**', 'model/render/scene.py', 'model/envelopes.py', 'model/fits.py', 'model/gates.py', 'model/geometry.py', 'model/base.py', 'model/gimbal.py', 'model/linkage.py', 'model/neck.py', 'model/ours.py', 'model/mjcf.py', 'model/stages.py', 'uv.lock') }}
          lookup-only: true
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3
        with:
          enable-cache: false   # uv sync downloads the wheels faster than the cache restores (#220)
      # the model matrix from the code (model/shards.py): a new document needs no edit here. "false" leaves a group
      # out: the filters' (empty in the weekly run, so everything)
      - name: List the shards
        id: lists
        run: |   # its own assignment, so a failing just fails the step
          shards=$(uv run just model-shards-list)
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
        env:
          MODEL: ${{ steps.filter.outputs.model }}
          MECH: ${{ steps.filter.outputs.mech }}
  code:
    name: Code
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    # uv, ngspice (model/electrical.py's SPICE circuit, which spicelib runs in batch mode), shellcheck, gh and yq
    container:
      image: ghcr.io/yellow-pine/noggin-ci-base:main   # ci/base.Dockerfile, which main's images.yml pushes (ADR 0009)
      env:   # uv's cache on the checkout's mount (/__w), so uv sync hard-links the venv: copying it took ~25 s
        UV_CACHE_DIR: /__w/uv-cache
        UV_LINK_MODE: hardlink
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes
      # restore only: this job never decomposes, so a save here would store the key without model/build/convex first
      # and the model job's full save would be refused (a key is written once). restore-keys: a PR that changes a part
      # starts from main's latest entry (a branch reads main's caches) and rebuilds only what its .key files miss
      - name: Restore the parts cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ours-convex-${{ hashFiles('model/printed/**', 'model/render/scene.py', 'model/envelopes.py', 'model/fits.py', 'model/gates.py', 'model/geometry.py', 'model/base.py', 'model/gimbal.py', 'model/linkage.py', 'model/neck.py', 'model/ours.py', 'model/mjcf.py', 'model/stages.py', 'uv.lock') }}
          restore-keys: ours-convex-
      - name: Run just check
        run: uv run just check | tee "$RUNNER_TEMP/pytest.txt"
        env:
          PYTEST_ADDOPTS: -m "not model" -n auto --durations=20
          OMP_NUM_THREADS: 1   # one BLAS/OpenMP thread per xdist worker: 4 workers x 4 spinning threads starve each other
      - name: List the slowest tests
        if: always()
        run: |
          { echo '```'; sed -n '/slowest .*durations/,/ in [0-9.]*s/p' "$RUNNER_TEMP/pytest.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # .releaserc.json's rules through semantic-release's own commit-analyzer (docs/adr/0017)
      - name: Test the release rules
        run: npm ci --prefix ci --ignore-scripts --no-audit --no-fund && node --test ci/release.test.mjs
      # SC2329/SC2317 never-invoked wizard-library functions (code differs by shellcheck version), SC2012 ls glob on /dev, SC2015 A && B || C on purpose
      - name: Run shellcheck
        run: shellcheck -e SC2329,SC2317,SC2012,SC2015 scripts/setup.sh noggin/hook.sh noggin/noggin
      # just check runs it offline; with a token it adds the audits that ask GitHub's API (known-vulnerable-actions,
      # impostor-commit among them): on main's push and weekly only, since they hang on the API's rate limits and
      # rarely turn on a PR's change (#561)
      - name: Run zizmor online
        if: ${{ github.event_name != 'pull_request' }}
        run: .venv/bin/zizmor -q .
        env:
          GH_TOKEN: ${{ github.token }}
      # a renamed job strands its old name in main's ruleset, where every PR then waits on it (#450)
      - name: Check the required checks
        run: |
          gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" \
            --jq '.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context' \
            | .venv/bin/python scripts/required_checks.py
        env:
          GH_TOKEN: ${{ github.token }}
  # a cold parts cache: from main's latest entry, builds the parts and cuts the stale ones (mjcf's own process pool),
  # then saves the cache the model shards restore. The cache, never an artifact: an artifact of a public repo is
  # anyone's to download, and the parts derive from the designer's models (#640, docs/adr/0019)
  convex:
    name: Convex
    needs: changes
    if: ${{ needs.changes.outputs.model != 'false' && needs.changes.outputs.parts != 'true' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes
      # no uv cache: pruned (the default) it held ~1 KB, unpruned 448 MB that restore in ~7 s, where uv sync downloads
      # every wheel in ~3 s (docs/research/2026-11-01-ci-budget.md)
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3
        with:
          enable-cache: false
      - name: Restore main's latest parts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ${{ needs.changes.outputs.parts-key }}
          restore-keys: ours-convex-   # as in code
      - name: Build and cut the parts
        run: uv run just ours && .venv/bin/python -m model.mjcf
      - name: Save the parts cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ${{ needs.changes.outputs.parts-key }}
  model:
    name: Model (${{ matrix.shard }})
    needs: [changes, convex]
    # convex is skipped when warm; its need by name, not !failure(), which a failed ancestor would trip
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.shards != '[]'
      && needs.convex.result != 'failure' }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      # four, balanced on measured seconds: the hero's sweep, each document (pytest -k on its parameter id; its tests
      # on one worker, --dist loadgroup), the rest, just sim and just mech (model/shards.py)
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.shards) }}   # {shard, units, tests} (model/test_shards.py)
    env:   # a shard of just mech alone, on a PR leaving the model's inputs alone, needs no parts, EGL or ngspice
      MODEL: ${{ needs.changes.outputs.model != 'false' }}
    steps:
      # just sim's SPICE circuit (model/electrical.py; model/test_electrical.py runs it as mujoco collects it) and
      # Mesa's EGL, which renders just view's scene offscreen (MUJOCO_GL below) in software: installed while the job
      # sets up
      - name: Install ngspice and EGL
        if: ${{ env.MODEL == 'true' }}
        run: (sudo apt-get update && sudo apt-get install -y ngspice libegl1 libegl-mesa0 libgl1-mesa-dri; echo $? > "$RUNNER_TEMP/apt.rc") > "$RUNNER_TEMP/apt.txt" 2>&1 &
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3
        with:
          enable-cache: false   # as in convex
      # our built parts and their convex pieces, as Convex saved them: just ours rebuilds only when
      # model/build/ours/.key no longer matches, model/mjcf.py decomposes a part again only when its
      # model/build/convex/<part>/.key does not
      - name: Restore the parts cache
        if: ${{ env.MODEL == 'true' }}
        id: parts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ${{ needs.changes.outputs.parts-key }}
          restore-keys: ours-convex-   # as in code
      # missed the exact key: decompose what is still stale before the tests, in mjcf's own process pool, or several
      # xdist workers would decompose the same part into the same folder at once
      - name: Rebuild and cut what is stale
        if: ${{ env.MODEL == 'true' && steps.parts.outputs.cache-hit != 'true' }}
        run: uv run just ours && .venv/bin/python -m model.mjcf
      - name: Make the venv
        run: uv run just venv
      - name: Wait for apt
        if: ${{ env.MODEL == 'true' }}
        run: |   # the install begun above
          timeout 300 sh -c 'until [ -f "$RUNNER_TEMP/apt.rc" ]; do sleep 1; done' || echo "apt still running" > "$RUNNER_TEMP/apt.rc"
          [ "$(cat "$RUNNER_TEMP/apt.rc")" = 0 ] || { cat "$RUNNER_TEMP/apt.txt" "$RUNNER_TEMP/apt.rc"; exit 1; }
      # each test's seconds (pytest-split), which the next balance is made from (just model-durations)
      - name: Run just test
        if: ${{ matrix.tests != '' }}
        run: mkdir -p "$RUNNER_TEMP/durations" && uv run just test | tee -a "$RUNNER_TEMP/pytest.txt"
        env:
          # a PR leaves the between-frames collision checks (-m certify) to main until #667 makes them fast (#679)
          PYTEST_ADDOPTS: >-
            -m "${{ github.event_name == 'pull_request' && 'model and not certify' || 'model' }}" -n auto --dist loadgroup --durations=20 --store-durations
            --durations-path ${{ runner.temp }}/durations/tests.json ${{ matrix.tests }}
          OMP_NUM_THREADS: 1   # as in code
          MUJOCO_GL: egl   # no display here (https://mujoco.readthedocs.io/en/stable/python.html#rendering)
      # the Mech stand-in (mech/, #222): the Core's program on its MicroPython's unix port beside the real noggin
      # service, the Link's live checks on the Mech (docs/use/noggin-service.md) as tests. Its unix port and hmac (just
      # micropython) cached on the MicroPython tag the justfile pins
      - name: Read the MicroPython tag
        if: ${{ contains(matrix.units, 'mech') }}
        id: tag
        run: echo "tag=$(uv run just --evaluate MICROPYTHON)" >> "$GITHUB_OUTPUT"
      - name: Restore the MicroPython build
        if: ${{ contains(matrix.units, 'mech') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: mech/build
          key: micropython-unix-${{ steps.tag.outputs.tag }}
      - name: Run just mech
        if: ${{ contains(matrix.units, 'mech') }}
        run: |   # and its core-seconds, as just sim's below
          start=$SECONDS
          uv run just mech | tee -a "$RUNNER_TEMP/pytest.txt"
          mkdir -p "$RUNNER_TEMP/durations"
          echo "{\"just mech\": $(( (SECONDS - start) * $(nproc --all) ))}" > "$RUNNER_TEMP/durations/mech.json"
        env:
          PYTEST_ADDOPTS: -n auto --durations=10
      - name: List the slowest tests
        if: ${{ always() && (matrix.tests != '' || contains(matrix.units, 'mech')) }}
        run: |
          { echo '```'; sed -n '/slowest .*durations/,/ in [0-9.]*s/p' "$RUNNER_TEMP/pytest.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # the print and FreeCAD exports as a smoke test, beside the hero's sweep: on main, and on a PR whose parts
      # missed their exact key (what they are made from changed)
      - name: Run just stl step
        if: ${{ contains(matrix.units, 'hero') && (github.event_name != 'pull_request' || steps.parts.outputs.cache-hit != 'true') }}
        run: uv run just stl step
      # the sim reports (just sim on our parts and envelopes, model/build/reports, never committed: ADR 0009), keyed
      # on what they are made from (over-broad on purpose: any model module, the justfile, this file). An exact hit is
      # main's reports for these very inputs, so the sim does not run; a miss restores main's latest reports (a PR reads
      # main's caches) as the baseline the new ones are diffed against in this job's summary. Main saves them for the
      # PRs after it and for the site, which publishes them at /reports (Site Deploy, pages.yml)
      - name: Restore the sim reports
        if: ${{ contains(matrix.units, 'sim') }}
        id: reports
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/reports
          key: sim-${{ hashFiles('model/*.py', 'model/servo_fit.json', 'model/printed/*.py', 'model/render/scene.py', 'model/render/hero.py', 'eyes/**', 'justfile', '.github/workflows/checks.yml', 'uv.lock') }}
          restore-keys: sim-
      - name: Run just sim
        if: ${{ contains(matrix.units, 'sim') && steps.reports.outputs.cache-hit != 'true' }}
        run: |   # and its core-seconds, as the tests' seconds summed over the xdist workers
          [ ! -d model/build/reports ] || mv model/build/reports model/build/main-reports
          start=$SECONDS
          uv run just sim
          mkdir -p "$RUNNER_TEMP/durations"
          echo "{\"just sim\": $(( (SECONDS - start) * $(nproc --all) ))}" > "$RUNNER_TEMP/durations/sim.json"   # --all: nproc heeds OMP_NUM_THREADS
        env:
          OMP_NUM_THREADS: 1   # a document per process (model/report.py), as the xdist workers in just test
      - name: Report the sim inputs unchanged
        if: ${{ contains(matrix.units, 'sim') && steps.reports.outputs.cache-hit == 'true' }}
        run: |
          echo "### Sim inputs unchanged: main's reports for them stand, no sim ran" >> "$GITHUB_STEP_SUMMARY"
      - name: Diff the reports against main's
        if: ${{ !cancelled() && contains(matrix.units, 'sim') && steps.reports.outputs.cache-hit != 'true' }}
        run: |
          {
            echo "### Sim reports against main's latest"
            if [ ! -d model/build/main-reports ]; then echo "No reports of main's to diff against."
            elif d=$(diff -ru -x '*.xml' model/build/main-reports model/build/reports); then echo "No change."
            else printf '```diff\n%s\n```\n' "${d:0:900000}"   # the summary holds 1 MiB a step
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save the sim reports
        if: ${{ contains(matrix.units, 'sim') && github.event_name != 'pull_request' && steps.reports.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/reports
          key: ${{ steps.reports.outputs.cache-primary-key }}
      - name: Upload the measured seconds
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: durations-${{ strategy.job-index }}
          path: ${{ runner.temp }}/durations/
          if-no-files-found: ignore   # a shard of just sim alone, its reports cached
          retention-days: 7
          overwrite: true   # a re-run of a failed shard
      # saved even when a test or just sim fails (a red main would otherwise never fill its cache); an interrupted build
      # is safe to keep, since each .key above is written last
      - name: Save the parts cache
        if: ${{ always() && env.MODEL == 'true' && steps.parts.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ${{ steps.parts.outputs.cache-primary-key }}
  # the next Mech's pictures and viewer GLB, the only ones published (#649, docs/adr/0019), when what they are made from
  # changed: rendered and baked from its trajectories on CI's software GL and saved for checks (and later runs) to
  # restore
  blender:
    name: Blender
    needs: changes
    if: ${{ needs.changes.outputs.next != 'true' }}
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/yellow-pine/noggin-ci-blender:main   # as code's
    env:
      TRAJ_DOCS: next   # the trajectories just pictures and just web draw from: the next Mech's alone
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; the token stays out of what is uploaded
      # restore only, as in code; the trajectories need no convex pieces (mjcf.model collide=False: no CoACD, #276)
      - name: Restore the parts cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ${{ needs.changes.outputs.parts-key }}
          restore-keys: ours-convex-
      - name: Run just pictures next
        run: uv run just BLENDER=blender pictures next
      - name: Run just web next
        run: uv run just BLENDER=blender web next
      - name: Save the next Mech's pictures
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/images
            web/build
          key: next-${{ needs.changes.outputs.next-hash }}
  # the docs (Astro Starlight, just site)
  site:
    name: Site
    needs: changes
    if: ${{ needs.changes.outputs.site == 'true' }}
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/yellow-pine/noggin-ci-base:main   # as code's
      env:
        UV_CACHE_DIR: /__w/uv-cache   # as code's: uv sync hard-links just site's venv, copying it took ~25 s (#386)
        UV_LINK_MODE: hardlink
      options: --ipc=host   # Chrome's shared memory, for mermaid-cli (https://playwright.dev/docs/docker)
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; the token stays out of what is uploaded
          fetch-depth: 0   # the tags and the commits since the last: the footer's version is git describe's (docs/adr/0017)
          filter: blob:none   # the history without its old files
      # Node by site/.nvmrc, npm's cache keyed on the lockfile (just site runs npm ci)
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      # main's latest sim reports (the sim shard saves them on main), which just site publishes at /reports: no entry
      # carries this key, so the newest sim- entry is restored. This runs beside the sim, so on main Site Deploy swaps
      # in the newest once it is done (just site-reports)
      - name: Restore main's sim reports
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/reports
          key: sim-latest
          restore-keys: sim-
      - name: Run just site
        run: uv run just site
      # the built site's HTML: pages, links, numbers, CSP; and the diagrams drawn by mermaid-cli in the image's Chrome
      - name: Test the built site
        run: npm --prefix site test
      # with the numbers its tests read (src/macros.json), for checks
      - name: Upload the built site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: built-site
          path: |
            site/dist
            site/src/macros.json
          include-hidden-files: true   # as upload-pages-artifact would take them
          if-no-files-found: error
          retention-days: 1
      # a Docs version's build, as release.yml makes each release's (docs/adr/0014): the same site under /noggin/v0.0/,
      # its links inside it (dist is rebuilt here, after its upload)
      - name: Test a docs version build
        run: npm --prefix site run build && npm --prefix site test
        env:
          SITE_BASE: /noggin/v0.0
  # the required check (#496): every job above passed or was skipped as its inputs were unchanged (a skipped required
  # check passes, so this one never skips; a failed need fails it). Then the built site, played in the runner's Chrome
  checks:
    name: Checks
    needs: [changes, code, convex, model, blender, site]
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    steps:
      - name: Check every job passed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35   # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: convex, model, blender, site
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; the token stays out of what is uploaded
      - name: Download the built site
        if: ${{ needs.site.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: built-site
          path: site
      # the next Mech's, made from this run's inputs: Blender's of this run, or an earlier run's (main's, or this PR's)
      - name: Restore the next Mech's pictures
        if: ${{ needs.site.result == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/images
            web/build
          key: next-${{ needs.changes.outputs.next-hash }}
          fail-on-cache-miss: true
      - name: Add the pictures and viewer
        if: ${{ needs.site.result == 'success' }}
        run: |   # as just site does: the next-* ones alone (docs/adr/0019)
          mkdir -p site/dist/images site/dist/viewer
          cp model/build/images/next-* site/dist/images/
          cp web/build/next-*.glb site/dist/viewer/
      - name: Set up Node
        if: ${{ needs.site.result == 'success' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install the site's packages
        if: ${{ needs.site.result == 'success' }}
        run: npm --prefix site ci --ignore-scripts --no-audit --no-fund
      # the links Site checked, now with the pictures they point at, and that every picture and GLB is one the code
      # publishes (site.test.mjs)
      - name: Check the links and the pictures
        if: ${{ needs.site.result == 'success' }}
        run: npm --prefix site test -- site.test.mjs -t "link|picture"
      # the viewer loads the next Mech, the diagrams draw, search finds a page, the version switcher switches, in the
      # runner's Chrome, with no CSP violation or console error and no request to another host but api.github.com
      - name: Smoke-test the site in Chrome
        if: ${{ needs.site.result == 'success' }}
        run: npm --prefix site run smoke
      # the PR's preview, and on main what Site Deploy deploys (actions/download-artifact by this run's id)
      - name: Upload the site
        if: ${{ needs.site.result == 'success' }}
        id: preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: site
          path: site/dist
          include-hidden-files: true   # as upload-pages-artifact would take them
          if-no-files-found: error
      - name: Link the preview
        if: ${{ needs.site.result == 'success' && github.event_name != 'push' && github.event_name != 'schedule' }}
        env:
          URL: ${{ steps.preview.outputs.artifact-url }}
        run: |
          {
            echo "Site preview with the next Mech's pictures and viewer: [the site artifact]($URL),"
            echo 'unzip it into a folder named noggin and run `python -m http.server` beside it, then open'
            echo 'http://localhost:8000/noggin/ (the site lives under /noggin/).'
          } >> "$GITHUB_STEP_SUMMARY"
      # once for the run: its critical path, every job along its needs up to here. Warm: the parts and the next Mech's
      # pictures cached from the same inputs
      - name: Check the CI budget
        run: python3 scripts/ci_budget.py ${{ needs.changes.outputs.parts == 'true' && needs.changes.outputs.next == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
