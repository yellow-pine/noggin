name: Checks
# Runs main's `just check`, the model tests with the Mech stand-in, sim and STL/STEP export, and builds its site.
# `Checks` is the gate every other job here leads into (#496), which Site Deploy and Release wait on. It runs on main
# (docs/adr/0009, #310), weekly and on any branch on demand (#562), never on a PR: a PR runs PR Gate (pr-gate.yml)
# alone (#696, #714, #722), and main fixes forward what it catches (#283).
# `Changes` is the one fan-out: what main's push (by git, against main's last commit whose Checks passed, #471)
# touches (dorny/paths-filter), the parts' cache looked up, and from the code the model shards (just model-shards-list);
# work whose inputs did not change is skipped, which the gate counts as passing. `Code` runs just check; `Model` the
# tests marked model in four shards balanced on the seconds they measured (model/shards.py: each document, the rest
# with just view's offscreen render, just sim when its inputs changed, and just mech,
# the Link's live checks on the Mech stand-in, #222), with just stl and just step; a cold parts cache is built and cut
# first (`Convex`, #223) and saved, so the shards start warm. Every artifact of a public repo is anyone's, so nothing
# derived from today's printed parts is rendered or uploaded (#640, docs/adr/0019) and the parts pass between jobs in
# the Actions cache alone. `Render` renders the next Mech alone (#649), in four shards (#770): its panels, its eye
# gimbal in motion and a picture per part (just pictures next) and its viewer GLBs (just web next), when what they are
# made from changed; `Blender` joins the shards.
# `Site`, after Blender, builds the docs (just site, docs/adr/0013) with main's latest sim reports and the next Mech's
# pictures and GLB, tests the built HTML, plays it in Chrome (Playwright) and uploads it (on main what Site Deploy,
# pages.yml, deploys). Code and Site run in our base image, Render in our Blender image; the others on the bare runner.
on:
  push:
    branches: [main]
  schedule:   # main's weekly full run (#471): no filters or output lookups, so every check runs, the filters' safety net
    - cron: "0 7 * * 1"
  # the same full run on any branch, on demand (#562): every check runs, so the Checks it posts on the branch's head
  # are a real one
  workflow_dispatch:
concurrency:   # main's runs queue, each running to completion, since Site Deploy and Release wait for a finished one
  # (#689; a newer push replaces one still waiting); the weekly run has its own group, so it neither waits behind a
  # push's run nor holds one up
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    shell: bash   # -eo pipefail: just's exit code survives the tee
jobs:
  changes:
    name: Changes
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write   # main's last checked commit; cancel-on-failure
    outputs:
      model: ${{ steps.filter.outputs.model }}
      release: ${{ steps.filter.outputs.release }}
      parts: ${{ steps.parts.outputs.cache-hit }}   # warm: convex skips
      parts-key: ${{ steps.parts.outputs.cache-primary-key }}
      next: ${{ steps.next.outputs.cache-hit }}   # warm: Blender skips, checks restores them
      next-hash: ${{ steps.inputs.outputs.next }}
      sim-hash: ${{ steps.inputs.outputs.sim }}
      shards: ${{ steps.lists.outputs.shards }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes
      # a push diffs against main's last commit whose push run here passed, not the one before it: a newer push
      # cancels the run in progress, and that commit's changes are then checked in the next run (#471). None: the
      # commit before the push (an empty base)
      - name: Find main's last checked commit
        if: ${{ github.event_name == 'push' }}
        id: checked
        run: |   # its own assignment, so a failing gh fails the step
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/checks.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Filter the changed paths
        if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d   # v4.0.3
        with:   # mech: the justfile's MicroPython tag, pyproject's mpy-cross pin; model: test_derived.py's MADE_FROM says why
          base: ${{ steps.checked.outputs.sha }}
          filters: |
            mech: ["eyes/**", "noggin/**", "reactions/**", "mech/**", "model/geometry.py", "justfile", "pyproject.toml", ".github/workflows/checks.yml"]
            model: ["model/**", "eyes/**", "conftest.py", "scripts/heavy.py", "scripts/inputs.py", "pyproject.toml", "uv.lock", ".python-version", "justfile", ".github/workflows/checks.yml"]
            release: [".releaserc.json", "ci/release.test.mjs", "ci/commitlint.config.mjs", "ci/commitlint.test.mjs", "ci/package-lock.json"]
      # a key hashes only what it is made from (#469, #732), with what that imports or names (scripts/inputs.py) and
      # uv.lock, so a justfile, workflow or test edit renders and simulates nothing: the next Mech's pictures and GLB
      # from the render code, the parts' make (model/ours.py) and Blender's pin; the sim reports from the sim, its
      # thresholds and the parts' make. Hashed here alone, on the runner's Python, for every job
      - name: Hash the cached outputs' inputs
        id: inputs
        run: |   # the inputs' sha256
          next=$(python3 scripts/inputs.py --hash model/render/pictures.py web/build.py model/ours.py ci/blender.Dockerfile uv.lock)
          echo "next=$next" >> "$GITHUB_OUTPUT"
          sim=$(python3 scripts/inputs.py --hash model/report.py model/test_report.py model/ours.py uv.lock)
          echo "sim=$sim" >> "$GITHUB_OUTPUT"
      # whether the next Mech's pictures and GLB made from the same inputs are cached: then Blender skips, nor pulls
      # its image (#386). The weekly and dispatched runs render again
      - name: Look up the next Mech's pictures
        if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
        id: next
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/images
            web/build
          key: next-${{ steps.inputs.outputs.next }}
          lookup-only: true
      # our built parts and their convex pieces: a hit starts the model shards warm, a miss runs convex first
      - name: Look up the parts cache
        id: parts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ours-convex-${{ hashFiles('model/printed/**', 'model/render/scene.py', 'model/envelopes.py', 'model/fits.py', 'model/gates.py', 'model/geometry.py', 'model/base.py', 'model/gimbal.py', 'model/linkage.py', 'model/neck.py', 'model/ours.py', 'model/mjcf.py', 'model/stages.py', 'uv.lock') }}
          lookup-only: true
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3
        with:
          enable-cache: false   # uv sync downloads the wheels faster than the cache restores (#220)
      # the model matrix from the code (model/shards.py): a new document needs no edit here. "false" leaves a group
      # out: the filters' (empty in the weekly run, so everything)
      - name: List the shards
        id: lists
        run: |   # its own assignment, so a failing just fails the step
          shards=$(uv run just model-shards-list)
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
        env:
          MODEL: ${{ steps.filter.outputs.model }}
          MECH: ${{ steps.filter.outputs.mech }}
      # the rest of the run cancelled at once (#769)
      - name: Cancel the run on failure
        if: ${{ failure() }}
        uses: ./.github/actions/cancel-on-failure
  code:
    name: Code
    needs: changes   # its release filter
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write   # cancel-on-failure
    # uv and the synced venv, ngspice (model/electrical.py's SPICE circuit, which spicelib runs in batch mode),
    # shellcheck, gh and yq
    container:
      image: ghcr.io/yellow-pine/noggin-ci-base:main   # ci/base.Dockerfile, which main's images.yml pushes (ADR 0009)
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes
      # the image's venv, synced from uv.lock (#725): uv run downloads nothing, or what a newer lock changed. A :main
      # from before #725 has none, and uv builds .venv as it did
      - name: Link the image's venv
        run: if [ -d /opt/uv/venv ]; then ln -s /opt/uv/venv .venv; fi
      # just check's parts. Restore only: this job never decomposes, so a save here would store the key without
      # model/build/convex first and the model job's full save would be refused (a key is written once). restore-keys:
      # a change to a part starts from main's latest entry and rebuilds only what its .key files miss
      - name: Restore the parts cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ours-convex-${{ hashFiles('model/printed/**', 'model/render/scene.py', 'model/envelopes.py', 'model/fits.py', 'model/gates.py', 'model/geometry.py', 'model/base.py', 'model/gimbal.py', 'model/linkage.py', 'model/neck.py', 'model/ours.py', 'model/mjcf.py', 'model/stages.py', 'uv.lock') }}
          restore-keys: ours-convex-
      - name: Run just check
        run: uv run just check | tee "$RUNNER_TEMP/pytest.txt"
        env:
          PYTEST_ADDOPTS: -m "not model" -n auto --durations=20
          OMP_NUM_THREADS: 1   # one BLAS/OpenMP thread per xdist worker: 4 workers x 4 spinning threads starve each other
      - name: List the slowest tests
        if: always()
        run: |
          { echo '```'; sed -n '/slowest .*durations/,/ in [0-9.]*s/p' "$RUNNER_TEMP/pytest.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # .releaserc.json's rules through semantic-release's own commit-analyzer (docs/adr/0017), and a PR title's
      # through commitlint's CLI (docs/adr/0010), when they, their tests or the packages changed ("false" alone skips:
      # the weekly run's filter is empty)
      - name: Test the release and title rules
        if: ${{ needs.changes.outputs.release != 'false' }}
        run: npm ci --prefix ci --ignore-scripts --no-audit --no-fund && node --test ci/release.test.mjs ci/commitlint.test.mjs
      # SC2012 ls glob on /dev, SC2015 A && B || C on purpose. It parses them, so just check's bash -n and sh -n run
      # locally alone (#732)
      - name: Run shellcheck
        run: shellcheck -e SC2012,SC2015 scripts/setup.sh noggin/hook.sh noggin/noggin
      # every audit, those that ask GitHub's API too (known-vulnerable-actions, impostor-commit among them), here alone,
      # never on a PR, since they hang on the API's rate limits and rarely turn on a PR's change (#561); just check runs
      # it offline locally alone (#732)
      - name: Run zizmor online
        run: .venv/bin/zizmor -q .
        env:
          GH_TOKEN: ${{ github.token }}
      # a renamed job strands its old name in main's ruleset, where every PR then waits on it (#450); a matrix job's
      # checks come and go with its matrix, so a required check names a gate job, one without a matrix (#570). A job
      # without a name reports its id
      - name: Check the required checks
        run: |   # its own assignment, so a failing gh fails the step
          required=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" \
            --jq '.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context')
          stale=$(comm -23 <(sort -u <<< "$required") \
            <(yq -N '.jobs[] | select(.strategy.matrix == null) | .name // key' .github/workflows/*.yml | sort -u))
          [ -z "$stale" ] && exit 0
          sed "s|.*|::error::Required check '&' names no gate job (one without a matrix) in .github/workflows: rename it in main's ruleset too, or require the gate that needs the matrix job.|" <<< "$stale"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
      # the rest of the run cancelled at once (#769)
      - name: Cancel the run on failure
        if: ${{ failure() }}
        uses: ./.github/actions/cancel-on-failure
  # a cold parts cache: from main's latest entry, builds the parts and cuts the stale ones (mjcf's own process pool),
  # then saves the cache the model shards restore. The cache, never an artifact: an artifact of a public repo is
  # anyone's to download, and the parts derive from the designer's models (#640, docs/adr/0019)
  convex:
    name: Convex
    needs: changes
    if: ${{ needs.changes.outputs.model != 'false' && needs.changes.outputs.parts != 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write   # cancel-on-failure
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes
      # no uv cache: pruned (the default) it held ~1 KB, unpruned 448 MB that restore in ~7 s, where uv sync downloads
      # every wheel in ~3 s (docs/research/2026-11-01-ci-budget.md)
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3
        with:
          enable-cache: false
      - name: Restore main's latest parts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ${{ needs.changes.outputs.parts-key }}
          restore-keys: ours-convex-   # as in code
      - name: Build and cut the parts
        run: uv run just ours && .venv/bin/python -m model.mjcf
      - name: Save the parts cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ${{ needs.changes.outputs.parts-key }}
      # the rest of the run cancelled at once (#769)
      - name: Cancel the run on failure
        if: ${{ failure() }}
        uses: ./.github/actions/cancel-on-failure
  model:
    name: Model (${{ matrix.shard }})
    needs: [changes, convex]
    # convex is skipped when warm; its need by name, not !failure(), which a failed ancestor would trip
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.shards != '[]'
      && needs.convex.result != 'failure' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write   # cancel-on-failure
    strategy:
      fail-fast: true   # a failed shard cancels the others (and cancel-on-failure the run, #769)
      # four, balanced on measured seconds: each document (pytest -k on its parameter id; its tests
      # on one worker, --dist loadgroup), the rest, just sim and just mech (model/shards.py)
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.shards) }}   # {shard, units, tests} (model/test_shards.py)
    env:   # a shard of just mech alone, on a PR leaving the model's inputs alone, needs no parts, EGL or ngspice
      MODEL: ${{ needs.changes.outputs.model != 'false' }}
    steps:
      # just sim's SPICE circuit (model/electrical.py; model/test_electrical.py runs it as mujoco collects it) and
      # Mesa's EGL, which renders just view's scene offscreen (MUJOCO_GL below) in software: installed while the job
      # sets up
      - name: Install ngspice and EGL
        if: ${{ env.MODEL == 'true' }}
        run: (sudo apt-get update && sudo apt-get install -y ngspice libegl1 libegl-mesa0 libgl1-mesa-dri; echo $? > "$RUNNER_TEMP/apt.rc") > "$RUNNER_TEMP/apt.txt" 2>&1 &
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3
        with:
          enable-cache: false   # as in convex
      # our built parts and their convex pieces, as Convex saved them: just ours rebuilds only when
      # model/build/ours/.key no longer matches, model/mjcf.py decomposes a part again only when its
      # model/build/convex/<part>/.key does not
      - name: Restore the parts cache
        if: ${{ env.MODEL == 'true' }}
        id: parts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ${{ needs.changes.outputs.parts-key }}
          restore-keys: ours-convex-   # as in code
      # missed the exact key: decompose what is still stale before the tests, in mjcf's own process pool, or several
      # xdist workers would decompose the same part into the same folder at once
      - name: Rebuild and cut what is stale
        if: ${{ env.MODEL == 'true' && steps.parts.outputs.cache-hit != 'true' }}
        run: uv run just ours && .venv/bin/python -m model.mjcf
      - name: Make the venv
        run: uv run just venv
      - name: Wait for apt
        if: ${{ env.MODEL == 'true' }}
        run: |   # the install begun above
          timeout 300 sh -c 'until [ -f "$RUNNER_TEMP/apt.rc" ]; do sleep 1; done' || echo "apt still running" > "$RUNNER_TEMP/apt.rc"
          [ "$(cat "$RUNNER_TEMP/apt.rc")" = 0 ] || { cat "$RUNNER_TEMP/apt.txt" "$RUNNER_TEMP/apt.rc"; exit 1; }
      # each test's seconds (pytest-split), which the next balance is made from (just model-durations)
      - name: Run just test
        if: ${{ matrix.tests != '' }}
        run: mkdir -p "$RUNNER_TEMP/durations" && uv run just test | tee -a "$RUNNER_TEMP/pytest.txt"
        env:
          PYTEST_ADDOPTS: >-
            -m model -n auto --dist loadgroup --durations=20 --store-durations
            --durations-path ${{ runner.temp }}/durations/tests.json ${{ matrix.tests }}
          OMP_NUM_THREADS: 1   # as in code
          MUJOCO_GL: egl   # no display here (https://mujoco.readthedocs.io/en/stable/python.html#rendering)
      # the Mech stand-in (mech/, #222): the Core's program on its MicroPython's unix port beside the real noggin
      # service, the Link's live checks on the Mech (docs/use/noggin-service.md) as tests. Its unix port and hmac (just
      # micropython) cached on the MicroPython tag the justfile pins
      - name: Read the MicroPython tag
        if: ${{ contains(matrix.units, 'mech') }}
        id: tag
        run: echo "tag=$(uv run just --evaluate MICROPYTHON)" >> "$GITHUB_OUTPUT"
      - name: Restore the MicroPython build
        if: ${{ contains(matrix.units, 'mech') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: mech/build
          key: micropython-unix-${{ steps.tag.outputs.tag }}
      - name: Run just mech
        if: ${{ contains(matrix.units, 'mech') }}
        run: |   # and its core-seconds, as just sim's below
          start=$SECONDS
          uv run just mech | tee -a "$RUNNER_TEMP/pytest.txt"
          mkdir -p "$RUNNER_TEMP/durations"
          echo "{\"just mech\": $(( (SECONDS - start) * $(nproc --all) ))}" > "$RUNNER_TEMP/durations/mech.json"
        env:
          PYTEST_ADDOPTS: -n auto --durations=10
      - name: List the slowest tests
        if: ${{ always() && (matrix.tests != '' || contains(matrix.units, 'mech')) }}
        run: |
          { echo '```'; sed -n '/slowest .*durations/,/ in [0-9.]*s/p' "$RUNNER_TEMP/pytest.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # the print and FreeCAD exports as a smoke test, beside the rest of the model tests
      - name: Run just stl step
        if: ${{ contains(matrix.units, 'rest') }}
        run: uv run just stl step
      # the sim reports (just sim on our parts and envelopes, model/build/reports, never committed: ADR 0009), keyed
      # on what they are made from (Changes hashes them, #732). An exact hit is
      # main's reports for these very inputs, so the sim does not run; a miss restores main's latest reports as the
      # baseline the new ones are diffed against in this job's summary. Saved for the site, which publishes them at
      # /reports (Site Deploy, pages.yml)
      - name: Restore the sim reports
        if: ${{ contains(matrix.units, 'sim') }}
        id: reports
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/reports
          key: sim-${{ needs.changes.outputs.sim-hash }}
          restore-keys: sim-
      - name: Run just sim
        if: ${{ contains(matrix.units, 'sim') && steps.reports.outputs.cache-hit != 'true' }}
        run: |   # and its core-seconds, as the tests' seconds summed over the xdist workers
          [ ! -d model/build/reports ] || mv model/build/reports model/build/main-reports
          start=$SECONDS
          uv run just sim
          mkdir -p "$RUNNER_TEMP/durations"
          echo "{\"just sim\": $(( (SECONDS - start) * $(nproc --all) ))}" > "$RUNNER_TEMP/durations/sim.json"   # --all: nproc heeds OMP_NUM_THREADS
        env:
          OMP_NUM_THREADS: 1   # a document per process (model/report.py), as the xdist workers in just test
      - name: Report the sim inputs unchanged
        if: ${{ contains(matrix.units, 'sim') && steps.reports.outputs.cache-hit == 'true' }}
        run: |
          echo "### Sim inputs unchanged: main's reports for them stand, no sim ran" >> "$GITHUB_STEP_SUMMARY"
      - name: Diff the reports against main's
        if: ${{ !cancelled() && contains(matrix.units, 'sim') && steps.reports.outputs.cache-hit != 'true' }}
        run: |
          {
            echo "### Sim reports against main's latest"
            if [ ! -d model/build/main-reports ]; then echo "No reports of main's to diff against."
            elif d=$(diff -ru -x '*.xml' model/build/main-reports model/build/reports); then echo "No change."
            else printf '```diff\n%s\n```\n' "${d:0:900000}"   # the summary holds 1 MiB a step
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save the sim reports
        if: ${{ contains(matrix.units, 'sim') && steps.reports.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/reports
          key: ${{ steps.reports.outputs.cache-primary-key }}
      - name: Upload the measured seconds
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: durations-${{ strategy.job-index }}
          path: ${{ runner.temp }}/durations/
          if-no-files-found: ignore   # a shard of just sim alone, its reports cached
          retention-days: 7
          overwrite: true   # a re-run of a failed shard
      # saved even when a test or just sim fails (a red main would otherwise never fill its cache); an interrupted build
      # is safe to keep, since each .key above is written last
      - name: Save the parts cache
        if: ${{ always() && env.MODEL == 'true' && steps.parts.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ${{ steps.parts.outputs.cache-primary-key }}
      # the rest of the run cancelled at once (#769)
      - name: Cancel the run on failure
        if: ${{ failure() }}
        uses: ./.github/actions/cancel-on-failure
  # the next Mech's pictures and viewer GLB, the only ones published (#649, docs/adr/0019), when what they are made from
  # changed: rendered and baked from its trajectories on CI's software GL in four shards (#770), each its share of the
  # pictures by frames (model/render/pictures.py share) and the first the GLB too, each saved for Blender to join
  render:
    name: Render (${{ matrix.shard }})
    needs: changes
    if: ${{ needs.changes.outputs.next != 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write   # cancel-on-failure
    container:
      image: ghcr.io/yellow-pine/noggin-ci-blender:main   # as code's
    strategy:
      fail-fast: true   # a failed shard cancels the others (and cancel-on-failure the run, #769)
      matrix:
        shard: [0, 1, 2, 3]   # Blender restores each
    env:
      TRAJ_DOCS: next   # the trajectories just pictures and just web draw from: the next Mech's alone
      PICTURES_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; the token stays out of what is uploaded
      - name: Link the image's venv   # as code's
        run: if [ -d /opt/uv/venv ]; then ln -s /opt/uv/venv .venv; fi
      # restore only, as in code; the trajectories need no convex pieces (mjcf.model collide=False: no CoACD, #276)
      - name: Restore the parts cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ${{ needs.changes.outputs.parts-key }}
          restore-keys: ours-convex-
      - name: Run just pictures next
        run: uv run just BLENDER=blender pictures next
      - name: Run just web next
        if: ${{ matrix.shard == 0 }}
        run: uv run just BLENDER=blender web next
      - name: Save the shard's pictures
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/images
            web/build
          key: next-${{ matrix.shard }}-${{ needs.changes.outputs.next-hash }}
      # the rest of the run cancelled at once (#769)
      - name: Cancel the run on failure
        if: ${{ failure() }}
        uses: ./.github/actions/cancel-on-failure
  # the shards' pictures and GLB joined into the one entry Site (and later runs) restore
  blender:
    name: Blender
    needs: [changes, render]
    if: ${{ needs.changes.outputs.next != 'true' }}   # as render's, so the gate allows its skip (test_site.py)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write   # cancel-on-failure
    steps:
      - name: Check out cancel-on-failure   # its last step's local action alone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes
          sparse-checkout: .github/actions
      - name: Restore shard 0's pictures
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/images
            web/build
          key: next-0-${{ needs.changes.outputs.next-hash }}
          fail-on-cache-miss: true
      - name: Restore shard 1's pictures
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/images
            web/build
          key: next-1-${{ needs.changes.outputs.next-hash }}
          fail-on-cache-miss: true
      - name: Restore shard 2's pictures
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/images
            web/build
          key: next-2-${{ needs.changes.outputs.next-hash }}
          fail-on-cache-miss: true
      - name: Restore shard 3's pictures
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/images
            web/build
          key: next-3-${{ needs.changes.outputs.next-hash }}
          fail-on-cache-miss: true
      - name: Save the next Mech's pictures
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/images
            web/build
          key: next-${{ needs.changes.outputs.next-hash }}
      # the rest of the run cancelled at once (#769)
      - name: Cancel the run on failure
        if: ${{ failure() }}
        uses: ./.github/actions/cancel-on-failure
  # the docs (Astro Starlight, just site) with the next Mech's pictures and GLB, tested and played in Chrome: main's
  # deploy. After Blender, so it builds, tests and plays the site once (#732); a skipped Blender (its pictures cached)
  # holds it up for nothing
  site:
    name: Site
    needs: [changes, blender]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write   # cancel-on-failure
    container:
      image: ghcr.io/yellow-pine/noggin-ci-base:main   # as code's
      options: --ipc=host   # Chrome's shared memory, for mermaid-cli and Playwright (https://playwright.dev/docs/docker)
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; the token stays out of what is uploaded
          fetch-depth: 0   # the tags and the commits since the last: the footer's version is git describe's (docs/adr/0017)
          filter: blob:none   # the history without its old files
      - name: Link the image's venv   # as code's
        run: if [ -d /opt/uv/venv ]; then ln -s /opt/uv/venv .venv; fi
      # Node by site/.nvmrc, npm's cache keyed on the lockfile (just site runs npm ci)
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      # main's latest sim reports (the sim shard saves them on main), which just site publishes at /reports: no entry
      # carries this key, so the newest sim- entry is restored. This runs beside the sim, so on main Site Deploy swaps
      # in the newest once it is done (just site-reports)
      - name: Restore main's sim reports
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/reports
          key: sim-latest
          restore-keys: sim-
      # the next Mech's, made from this run's inputs: Blender's of this run, or an earlier run's; just site adds the
      # next-* ones alone (docs/adr/0019)
      - name: Restore the next Mech's pictures
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/images
            web/build
          key: next-${{ needs.changes.outputs.next-hash }}
          fail-on-cache-miss: true
      - name: Run just site
        run: uv run just site
      # the built site's HTML: pages, links (the pictures' too), numbers, CSP, every picture and GLB one the code
      # publishes; and the diagrams drawn by mermaid-cli in the image's Chrome
      - name: Test the built site
        run: npm --prefix site test
      # the viewer loads the next Mech, the diagrams draw, search finds a page, the header names the newest release, an
      # old docs version's URL lands on the docs, in the image's Chrome, with no CSP violation or console error and no request to another host but api.github.com
      - name: Smoke-test the site in Chrome
        run: npm --prefix site run smoke
      # on main what Site Deploy deploys (actions/download-artifact by this run's id); a dispatched run's preview
      - name: Upload the site
        id: preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: site
          path: site/dist
          include-hidden-files: true   # as upload-pages-artifact would take them
          if-no-files-found: error
      - name: Link the preview
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          URL: ${{ steps.preview.outputs.artifact-url }}
        run: |
          {
            echo "Site preview with the next Mech's pictures and viewer: [the site artifact]($URL),"
            echo 'unzip it into a folder named noggin and run `python -m http.server` beside it, then open'
            echo 'http://localhost:8000/noggin/ (the site lives under /noggin/).'
          } >> "$GITHUB_STEP_SUMMARY"
      # the rest of the run cancelled at once (#769)
      - name: Cancel the run on failure
        if: ${{ failure() }}
        uses: ./.github/actions/cancel-on-failure
  # the gate (#496): every job above passed, or was skipped as its inputs were unchanged (it never skips itself; a
  # failed need fails it)
  checks:
    name: Checks
    needs: [changes, code, convex, model, render, blender, site]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - name: Check every job passed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35   # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: convex, model, render, blender
