name: Dependabot Auto-merge
# Turns on auto-merge (squash) for Dependabot's PRs: each merges once the required checks and Claude's review pass.
# Majors too: auto-merge waits for main's ruleset (the required checks, Claude's review among them).
# GitHub's recipe: docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions
on: pull_request
permissions: {}
jobs:
  auto-merge:
    name: Auto-merge
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      # shortcut: a merge GITHUB_TOKEN enabled starts no push workflow on main (Code Checks, Site Deploy); the next
      # merge runs them. Upgrade to the bot App's token (ADR 0010) stored as Dependabot secrets.
      - name: Turn on auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
