name: Main Red
# Opens one `main-red` issue while main's Checks or Site Deploy fail, and closes it once main deploys again; a failed
# CI Images run (main alone builds the images, #729) opens one `main-red-images` issue, closed by its next push.
# PRs run a slim gate, so main's post-merge run catches what they no longer run (#697). A failed run opens the issue
# (that label, bug, ready-for-agent; titled 'fix(ci): main red on <sha7>', #767) linking the commit and the run, or
# comments on the open one, found by its label, as does a run a failed step cancelled (cancel-on-failure, #769);
# anything else (a pass, a cancelled run superseded) says nothing (#745). It acts only for this repository's runs on main
# (branches: [main] alone also matches a fork's PR from a branch named main).
on:
  workflow_run:   # zizmor: ignore[dangerous-triggers] the job acts only on this repo's runs on main, checks out nothing
    workflows: ["Checks", "Site Deploy", "CI Images"]   # by their names (test_workflows.py)
    types: [completed]
    branches: [main]
concurrency:   # one at a time, so two red runs never open two issues
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions: {}
jobs:
  report:
    name: Report
    if: >-
      ${{ github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-26.04
    permissions:
      actions: read   # the run's jobs
      issues: write
    steps:
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # found by its label, never its title, which anyone may edit (#767); the title is a Conventional Commit
          label=main-red title="fix(ci): main red on ${SHA:0:7}" done="Site Deploy deployed it"
          if [ "$WORKFLOW" = "CI Images" ]; then
            label=main-red-images title="fix(ci): main red in CI Images on ${SHA:0:7}"
            done="CI Images pushed the images"
          fi
          # the open one, by the issues API: search lags a just-opened issue
          issue=$(gh issue list --label "$label" --json number --jq '.[0].number // empty')
          # a failed step cancels the rest of its run (cancel-on-failure, #769), its own job too, which may then read
          # cancelled: a cancelled run with a failed step is red
          if [ "$CONCLUSION" = cancelled ] && [ "$(gh run view "$RUN_ID" --json jobs \
            --jq '[.jobs[].steps[]? | select(.conclusion == "failure")] | length')" -gt 0 ]; then CONCLUSION=failure; fi
          case "$CONCLUSION" in
            failure|timed_out|startup_failure)
              body="Main's $WORKFLOW failed on $SHA: $RUN_URL"
              if [ -n "$issue" ]; then gh issue comment "$issue" --body "$body"
              else gh issue create --title "$title" --label "$label",bug,ready-for-agent --body "$body"; fi ;;
            success)   # green once CI Images pushed, or Site Deploy's Deploy put a commit up (red Checks skip it)
              case "$WORKFLOW" in
                "CI Images") green=1 ;;
                "Site Deploy") green=$(gh run view "$RUN_ID" --json jobs \
                  --jq '[.jobs[] | select(.name == "Deploy" and .conclusion == "success")] | length') ;;
                *) green=0 ;;
              esac
              if [ -n "$issue" ] && [ "$green" -gt 0 ]; then
                gh issue edit "$issue" --remove-label ready-for-agent,in-progress,blocked,on-hold
                gh issue close "$issue" --comment "Main is green again: $done ($RUN_URL)."
              fi ;;
          esac
