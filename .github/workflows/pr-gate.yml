name: PR Gate
# Runs a PR's slim gate: `just check-light` (ruff, pyright and the fast tests), then the required `Checks`.
# Everything heavier is main's Checks (checks.yml), which fixes forward what it catches (#283, #696, #714). Its own
# workflow (#722), so a PR lists no job that every PR skips (test_workflows.py). `Checks` is the required check: it
# fails unless Code passed (a skipped required check passes, so this one never skips). Code runs in our base image
# (ci/base.Dockerfile).
on:
  pull_request:   # never on edited: a title or body edit would cancel this run, or green a red one (#496)
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
defaults:
  run:
    shell: bash   # -eo pipefail: just's exit code survives the tee
jobs:
  code:
    name: Code
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: ghcr.io/yellow-pine/noggin-ci-base:main   # as checks.yml's Code
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes
      - name: Link the image's venv   # as checks.yml's Code (#725)
        run: if [ -d /opt/uv/venv ]; then ln -s /opt/uv/venv .venv; fi
      - name: Run just check-light
        run: uv run just check-light | tee "$RUNNER_TEMP/pytest.txt"
        env:
          PYTEST_ADDOPTS: -m "not model" -n auto --durations=20 --timeout=15   # as checks.yml's Code (#808)
          OMP_NUM_THREADS: 1   # one BLAS/OpenMP thread per xdist worker: 4 workers x 4 spinning threads starve each other
      - name: List the slowest tests
        if: always()
        run: |
          { echo '```'; sed -n '/slowest .*durations/,/ in [0-9.]*s/p' "$RUNNER_TEMP/pytest.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
  # the required check (#496): Code passed. A skipped required check passes, so this one never skips; a failed need
  # fails it
  checks:
    name: Checks
    needs: [code]
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check every job passed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35   # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
