name: Release Please
# Keeps the release PR (version bump, CHANGELOG.md), auto-merged on green; merged, tags and releases it.
# The PR (docs/adr/0010) carries the next version in pyproject.toml, uv.lock and .release-please-manifest.json, and its
# CHANGELOG.md entry, from the Conventional Commit titles merged since the last release. It runs on a token minted per
# run from the release GitHub App (CONTRIBUTING.md): what GITHUB_TOKEN creates starts no workflow, so the PR would get
# no checks, its auto-merge no push to main and its tag no Release Assets. The PR auto-merges only when a feature or a
# break is pending, or Release Now asked (#407); till then it is a draft, which no check runs on (#414).
# Merged, the PR's next run tags vX.Y.Z and releases it.
# Until the App's RELEASE_APP_CLIENT_ID variable exists, the run only leaves a notice.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:   # one run at a time on main, never cancelled mid-release
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions: {}
jobs:
  release:
    name: Release Please
    runs-on: ubuntu-26.04
    steps:
      - name: Skip until the release App is set up
        if: ${{ !vars.RELEASE_APP_CLIENT_ID }}
        run: |
          echo "::notice::Release Please skipped: set up the release App and its RELEASE_APP_CLIENT_ID variable (CONTRIBUTING.md)"
      - name: Mint the release App's token
        id: app
        if: ${{ vars.RELEASE_APP_CLIENT_ID }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510   # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Update the release PR or release
        id: release
        if: ${{ steps.app.outputs.token }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7   # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
      - name: Check out the release gate
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/release_gate.py
          sparse-checkout-cone-mode: false
      - name: Gate the release PR's auto-merge
        if: ${{ steps.release.outputs.pr }}
        env:   # on for a feature, a break or the App's `release now` label, off otherwise (scripts/release_gate.py)
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP: ${{ steps.app.outputs.app-slug }}[bot]
          PR: ${{ steps.release.outputs.pr }}   # JSON; the step's env is read even when its `if` skips it
        run: |
          n=$(jq -r .number <<<"$PR")
          view=$(gh pr view "$n" --json body,autoMergeRequest)
          events=$(gh api --paginate --slurp "repos/{owner}/{repo}/issues/$n/events")
          gate=$(jq -n --argjson pr "$view" --argjson ev "$events" '{body: $pr.body, events: ($ev | add)}' |
            python3 scripts/release_gate.py "$APP")
          if [ "$gate" = on ]; then
            gh pr ready "$n"   # out of draft: the checks and the review run once, now (#414)
            gh pr merge "$n" --auto --squash
          elif [ "$(jq .autoMergeRequest <<<"$view")" != null ]; then
            gh pr merge "$n" --disable-auto
            echo "::notice::Release PR #$n waits for a feature, a break or Release Now"
          fi
