name: CI Images
# Builds the CI images the Chrome and Blender jobs run in; main pushes them to GHCR.
# ghcr.io/yellow-pine/noggin-ci-base and -blender (base plus Blender; ci/, docs/adr/0009, #288) are what the jobs
# needing a tool uv can't install run in, by the :main tag (`container:`, #481); base also carries uv's Python and the
# venv synced from uv.lock, which those jobs link as .venv (#725). Only main writes to the registry: on a push that
# changes a Dockerfile (Dependabot's base-image bumps in ci/ carry the distro's security fixes, #472) or the venv's
# inputs (uv.lock, pyproject.toml, .python-version: Dependabot's Python bumps keep the baked venv current), weekly
# and on a dispatch from main, it pushes both as :main with their build provenance (GitHub's attestations) and refreshes
# the layer cache; the next job to start pulls them. The weekly run and a dispatch build without the cache, so the apt
# layers take the security fixes and the newest gh, on Mondays before image-scan.yml's scan (#534). No PR builds them
# (#729): a broken Dockerfile fails main's run without moving :main, main's Code job lints it (hadolint), and
# default-branch-failure.yml files a `default branch images failure` issue.
run-name: "${{ github.event_name == 'schedule' && 'CI Images: weekly uncached rebuild' || github.event_name == 'workflow_dispatch' && format('CI Images: manual by {0}', github.actor) || '' }}"
on:
  schedule:
    - cron: "0 4 * * 1"
  push:
    branches: [main]
    paths: ["ci/*.Dockerfile", ".github/workflows/ci-images.yml", "uv.lock", "pyproject.toml", ".python-version"]
  workflow_dispatch:
concurrency:   # a newer run on main replaces a running one
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
env:
  REPO: ghcr.io/yellow-pine/noggin-ci
jobs:
  push:
    name: Push
    if: ${{ github.ref == 'refs/heads/main' }}   # a dispatch can name another branch
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write   # the only job that writes to GHCR
      id-token: write   # the provenance attestations
      attestations: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6   # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # zstd layers unpack faster where each job pulls them; the registry cache keeps every stage's layers (mode=max)
      - name: Push the base image
        id: base
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: .   # the repo: the venv's pyproject.toml, uv.lock and .python-version
          file: ci/base.Dockerfile
          tags: ${{ env.REPO }}-base:main
          outputs: type=image,push=true,compression=zstd,force-compression=true
          provenance: false   # one manifest; the attestation below is GitHub's
          no-cache: ${{ github.event_name != 'push' }}   # a cached apt layer would keep last build's packages
          cache-from: type=registry,ref=${{ env.REPO }}-base:cache
          cache-to: type=registry,ref=${{ env.REPO }}-base:cache,mode=max
      - name: Push the Blender image
        id: blender
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: ci
          file: ci/blender.Dockerfile
          build-args: BASE=${{ env.REPO }}-base@${{ steps.base.outputs.digest }}
          tags: ${{ env.REPO }}-blender:main
          outputs: type=image,push=true,compression=zstd,force-compression=true
          provenance: false
          no-cache: ${{ github.event_name != 'push' }}
          cache-from: type=registry,ref=${{ env.REPO }}-blender:cache
          cache-to: type=registry,ref=${{ env.REPO }}-blender:cache,mode=max
      - name: Attest the base image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8   # v4.2.2
        with:
          subject-name: ${{ env.REPO }}-base
          subject-digest: ${{ steps.base.outputs.digest }}
          push-to-registry: true
      - name: Attest the Blender image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8   # v4.2.2
        with:
          subject-name: ${{ env.REPO }}-blender
          subject-digest: ${{ steps.blender.outputs.digest }}
          push-to-registry: true
