name: Release Now
# Releases whatever is pending: marks the open release PR ready, turns on its auto-merge and labels it `release now`.
# The label keeps Release Please's gate from turning auto-merge off through later updates (docs/adr/0010, #407, #414).
# It runs as the bot App, like Release Please, so the ready PR gets its checks, the merge pushes to main as the App
# and the tag starts Release Assets. The /release skill runs it.
on:
  workflow_dispatch:
concurrency:   # Release Please's group: its gate never reads the PR between this run's label and its auto-merge
  group: Release Please
  cancel-in-progress: false
permissions: {}
jobs:
  release-now:
    name: Release Now
    runs-on: ubuntu-26.04
    steps:
      - name: Mint the bot App's token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510   # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Merge the release PR on green
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          AUTHOR: app/${{ steps.app.outputs.app-slug }}
        # the release PR: release-please's branch, opened by the App, labelled pending (a label alone is anyone's).
        # The label is removed and added again, so its newest event is the App's (scripts/release_gate.py)
        run: |
          n=$(gh pr list --state open --head release-please--branches--main --label "autorelease: pending" \
            --json number,author --jq "map(select(.author.login == \"$AUTHOR\")) | .[0].number // empty")
          if [ -z "$n" ]; then
            echo "::error::No open release PR: nothing has been merged to release since the last one"
            exit 1
          fi
          gh label create "release now" --color 0e8a16 --description "Release Now: auto-merge on green" --force
          if gh pr view "$n" --json labels --jq '.labels[].name' | grep -qx "release now"; then
            gh pr edit "$n" --remove-label "release now"
          fi
          gh pr edit "$n" --add-label "release now"
          gh pr ready "$n"
          gh pr merge "$n" --auto --squash
          echo "::notice::Release PR #$n merges on green"
