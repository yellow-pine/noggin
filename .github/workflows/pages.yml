name: Site Deploy
# Main's site to GitHub Pages (yellowpine.com/noggin/, docs/adr/0009), built once: Site Checks (site-checks.yml) builds
# and tests it on PRs and on main, and this deploys a main commit's site artifact once both its check workflows passed
# (#310), with no rebuild. It runs when either of them completes for a push to main; `checks` (scripts/deploy_status.py)
# acts once both are done: it hands `deploy` the Site Checks run to download from when both passed, else sets the
# commit's `deploy` status: failure linking the red one ("not deployed: checks failed", #295) or error when a newer
# commit superseded it (a cancelled run). `deploy` swaps in the sim reports Code Checks saved (Site Checks runs beside
# it), unpacks every Release's docs beside main's (docs/adr/0014), deploys, and `deploy-status` sets success with the
# site's URL or why not (#292); Site Checks set it pending while they build. A red run leaves the last site up. Pages'
# source is GitHub Actions (POST /repos/{owner}/{repo}/pages, build_type=workflow); deploy's github-pages environment
# lists each deploy with its URL in the repo's Deployments panel. It acts only for this repository's push to main
# (branches: [main] alone also matches a fork's PR from a branch named main), on that push's commit (head_sha), the one
# the status goes on.
on:
  workflow_run:
    workflows: ["Code Checks", "Site Checks"]   # as deploy_status.CHECKS (scripts/test_deploy_status.py)
    types: [completed]
    branches: [main]
permissions: {}
jobs:
  checks:
    if: >-
      ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # the commit's check runs
      statuses: write
    outputs:
      site-run: ${{ steps.gate.outputs.site-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          sparse-checkout: scripts/deploy_status.py
          sparse-checkout-cone-mode: false
          persist-credentials: false   # nothing here pushes
      - id: gate
        run: python3 scripts/deploy_status.py checks
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  deploy:
    needs: checks
    if: ${{ needs.checks.outputs.site-run != '' }}
    # one deploy at a time; a newer one waiting cancels an older waiting one (its status says superseded), so main
    # ends on its latest. Not in progress: a deploy is a minute, and the same commit may come twice (both workflows
    # completing together)
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # Site Checks' artifact
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: |
            Makefile
            scripts/docs_versions.py
          sparse-checkout-cone-mode: false
          persist-credentials: false   # nothing here pushes; the token stays out of what is uploaded
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: site
          path: site/dist
          run-id: ${{ needs.checks.outputs.site-run }}
          github-token: ${{ github.token }}
      # main's latest sim reports, which Code Checks' sim shard has saved by now (newest sim- entry, as in Site Checks)
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/reports
          key: sim-latest
          restore-keys: sim-
      - run: make site-reports
      # every Release's docs at vX.Y/ beside main's, and the switcher's versions.json (docs/adr/0014)
      # shortcut: a release whose docs asset lands after this commit's deploy shows from the next deploy on; dispatch
      # Site Deploy from Release Assets if that wait matters
      - run: python3 scripts/docs_versions.py site/dist
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
  # always(): a cancelled deploy says so too
  deploy-status:
    needs: [checks, deploy]
    if: ${{ always() && needs.checks.outputs.site-run != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          sparse-checkout: scripts/deploy_status.py
          sparse-checkout-cone-mode: false
          persist-credentials: false   # nothing here pushes
      - run: python3 scripts/deploy_status.py deploy
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
