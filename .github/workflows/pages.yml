name: pages
# The web viewer (docs/adr/0008): builds web/ into a site and deploys it to GitHub Pages. Not a required check: a red
# run leaves the last site up. Pages' source is GitHub Actions (POST /repos/{owner}/{repo}/pages, build_type=workflow).
on:
  push:
    branches: [main]
    paths: ["model/**", "eyes/**", "web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
concurrency:   # one deployment at a time, never cancelled midway (GitHub's starter workflow)
  group: pages
  cancel-in-progress: false
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78   # v7.6.0
        with:
          enable-cache: true
      # the check workflow's cache of our built parts (same key: its heavy job fills it); restore only, since a save here
      # would store the key without model/build/convex first and the check workflow's full save would be refused
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ours-convex-${{ hashFiles('model/printed/**', 'model/envelopes.py', 'model/geometry.py', 'model/ours.py', 'model/mjcf.py', 'uv.lock') }}
      - run: make web
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: web/build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
