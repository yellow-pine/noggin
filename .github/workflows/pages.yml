name: pages
# The site (docs/adr/0009): MkDocs builds the docs (make site) with the web viewer at site/viewer, whose GLBs Blender
# bakes and make web tests (docs/adr/0008) whenever what they are made from changed, on PRs too (#221); main deploys it
# to GitHub Pages (yellowpine.com/noggin/), a PR uploads it as an artifact. Not a required check: a red run leaves the
# last site up. Pages' source is GitHub Actions (POST /repos/{owner}/{repo}/pages, build_type=workflow).
on:
  push:
    branches: [main]
    paths: ["model/**", "eyes/**", "web/**", "docs/**", "**/*.md", "mkdocs.yml", "Makefile", "pyproject.toml",
            "uv.lock", ".github/workflows/pages.yml", "macros.py", "reactions/**", "noggin/**"]   # macros.py reads the code
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["model/**", "eyes/**", "web/**", "docs/**", "**/*.md", "mkdocs.yml", "Makefile", "pyproject.toml", "uv.lock",
            ".github/workflows/pages.yml", "macros.py"]
  workflow_dispatch:
# one deployment at a time, never cancelled midway (GitHub's starter workflow); a new push to a PR cancels its run
concurrency:
  group: pages-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
jobs:
  site:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # scripts/ci_budget.py reads the run's start
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; the token stays out of what is uploaded
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78   # v7.6.0
        with:
          enable-cache: false   # as in check.yml
      # the viewer (Blender's GLBs and three.js's Draco decoder in web/build) built and tested by make web when what it
      # is made from changed, else the last one built from the same inputs: a docs-only change bakes nothing
      - id: viewer
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: web/build
          key: viewer-${{ hashFiles('model/**', '!model/build/**', 'eyes/**', 'web/**', 'Makefile', 'uv.lock', '.github/workflows/pages.yml') }}
      # the check workflow's cache of our built parts (same key: its model job fills it); restore only, since a save here
      # would store the key without model/build/convex first and the check workflow's full save would be refused;
      # restore-keys as in check.yml: a part's own .key rebuilds only what changed
      - if: ${{ steps.viewer.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ours-convex-${{ hashFiles('model/printed/**', 'model/envelopes.py', 'model/geometry.py', 'model/ours.py', 'model/mjcf.py', 'model/stages.py', 'uv.lock') }}
          restore-keys: ours-convex-
      # the latest trajectories: make web rebakes only the Stages whose stamp moved (model/trajectories.py)
      - if: ${{ steps.viewer.outputs.cache-hit != 'true' }}
        id: trajectories
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/trajectories
          key: trajectories-${{ hashFiles('model/**', '!model/build/**', 'eyes/**', 'uv.lock') }}
          restore-keys: trajectories-
      # Blender 5.2.2, the pinned Linux tarball (docs/research/2026-11-01-web-viewer.md), sha256-checked on every run
      - if: ${{ steps.viewer.outputs.cache-hit != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: ~/blender.tar.xz
          key: blender-5.2.2-linux-x64
      - if: ${{ steps.viewer.outputs.cache-hit != 'true' }}
        run: |
          [ -f ~/blender.tar.xz ] || curl -fsSL -o ~/blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          echo "84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  $HOME/blender.tar.xz" | sha256sum -c
          mkdir ~/blender && tar -xJf ~/blender.tar.xz -C ~/blender --strip-components=1
      # the X and GL libraries Blender links against, even in the background
      - if: ${{ steps.viewer.outputs.cache-hit != 'true' }}
        run: sudo apt-get update && sudo apt-get install -y libxi6 libxkbcommon0 libxxf86vm1 libxfixes3 libxrender1 libsm6 libgl1 libegl1
      - if: ${{ steps.viewer.outputs.cache-hit != 'true' }}
        run: make web BLENDER=$HOME/blender/blender
      # saved even when a web test fails, as check.yml saves the parts: the baked trajectories stay good
      - if: ${{ always() && steps.viewer.outputs.cache-hit != 'true' && steps.trajectories.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/trajectories
          key: ${{ steps.trajectories.outputs.cache-primary-key }}
      - if: ${{ steps.viewer.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: web/build
          key: ${{ steps.viewer.outputs.cache-primary-key }}
      - run: make site
      - if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: site
      # the PR's preview: the built site as an artifact, linked from the job summary
      - if: ${{ github.event_name == 'pull_request' }}
        id: preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: site
          path: site
      - if: ${{ github.event_name == 'pull_request' }}
        env:
          URL: ${{ steps.preview.outputs.artifact-url }}
        run: |
          echo "Site preview with the web viewer: [the site artifact]($URL)," >> "$GITHUB_STEP_SUMMARY"
          echo 'unzip it and run `python -m http.server -d <folder>`.' >> "$GITHUB_STEP_SUMMARY"
      # as in check.yml; warm: the GLBs or the trajectories hit their exact key (Blender bakes GLBs in about 40 s)
      - run: python3 scripts/ci_budget.py ${{ steps.viewer.outputs.cache-hit == 'true' || steps.trajectories.outputs.cache-hit == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
