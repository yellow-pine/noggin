name: Site Deploy
# The site (docs/adr/0009): `render` renders the README's pictures in Blender (make pictures, #226; each part split
# by frame range over runners, #278; the required `pictures` check sums them up) beside `viewer`, whose GLBs Blender bakes and make web tests (docs/adr/0008)
# whenever what they are made from changed, on PRs too (#221); then `site` joins the frames into the pictures and MkDocs
# builds the docs (make site) with them at site/images, the viewer at site/viewer and main's latest sim reports at
# site/reports. Main deploys it to GitHub Pages (yellowpine.com/noggin/) once the check workflow is done with the push
# (workflow_run: its sim shard has saved the reports by then); a PR uploads it as an artifact. `site` is a required
# check on PRs that touch what the site is made from (the changes job, as in mech.yml); a red main run leaves the last
# site up, and a cancelled check run (a newer push superseded it) builds nothing. Pages' source is GitHub Actions
# (POST /repos/{owner}/{repo}/pages, build_type=workflow).
on:
  workflow_run:
    workflows: ["Code Checks"]
    types: [completed]
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
# one run per PR, and one for main: a newer one cancels the one in progress, deploy included (#283), so main deploys
# its latest only; a run for a cancelled check run builds nothing (render, viewer and site below), so it gets a group
# of its own and cancels no deploy
concurrency:
  group: pages-${{ github.event.pull_request.number || github.event.workflow_run.conclusion == 'cancelled' && github.run_id || 'deploy' }}
  cancel-in-progress: true
permissions: {}
jobs:
  changes:   # as in mech.yml; main and workflow_dispatch build everything
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      site: ${{ steps.filter.outputs.site }}
    steps:
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d   # v4.0.3
        with:
          filters: |
            site: ["model/**", "eyes/**", "web/**", "docs/**", "**/*.md", "mkdocs.yml", "Makefile", "pyproject.toml", "uv.lock",
                   ".github/workflows/pages.yml", "macros.py", "mermaid.py", "home.py", "vendored.py", "overrides/**"]
  # every deploy replaces the whole site, so every run has the pictures: rendered when what they are made from changed,
  # else the last frames rendered from the same inputs (a docs-only change renders nothing). Each part (pictures.py SITE)
  # is split by frame range over runners, about 10 frames a runner (~4-5 s a frame on CI's software GL, plus ~30 s for
  # Blender's first; #278), and the site job joins the shards into the pictures
  render:
    name: render (${{ matrix.part }} ${{ matrix.shard }}/${{ matrix.of }})
    needs: changes
    if: >-   # as site
      ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.site != 'false'
      && github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # every shard runs to its end; site fails unless all of them succeeded
      matrix:   # every SITE part, its shards 1..of (test_site.py)
        include:
          - {part: views, shard: 1, of: 5}
          - {part: views, shard: 2, of: 5}
          - {part: views, shard: 3, of: 5}
          - {part: views, shard: 4, of: 5}
          - {part: views, shard: 5, of: 5}
          - {part: hero, shard: 1, of: 10}
          - {part: hero, shard: 2, of: 10}
          - {part: hero, shard: 3, of: 10}
          - {part: hero, shard: 4, of: 10}
          - {part: hero, shard: 5, of: 10}
          - {part: hero, shard: 6, of: 10}
          - {part: hero, shard: 7, of: 10}
          - {part: hero, shard: 8, of: 10}
          - {part: hero, shard: 9, of: 10}
          - {part: hero, shard: 10, of: 10}
          - {part: bored, shard: 1, of: 10}
          - {part: bored, shard: 2, of: 10}
          - {part: bored, shard: 3, of: 10}
          - {part: bored, shard: 4, of: 10}
          - {part: bored, shard: 5, of: 10}
          - {part: bored, shard: 6, of: 10}
          - {part: bored, shard: 7, of: 10}
          - {part: bored, shard: 8, of: 10}
          - {part: bored, shard: 9, of: 10}
          - {part: bored, shard: 10, of: 10}
          - {part: attention, shard: 1, of: 5}
          - {part: attention, shard: 2, of: 5}
          - {part: attention, shard: 3, of: 5}
          - {part: attention, shard: 4, of: 5}
          - {part: attention, shard: 5, of: 5}
          - {part: thinking, shard: 1, of: 5}
          - {part: thinking, shard: 2, of: 5}
          - {part: thinking, shard: 3, of: 5}
          - {part: thinking, shard: 4, of: 5}
          - {part: thinking, shard: 5, of: 5}
          - {part: eureka, shard: 1, of: 3}
          - {part: eureka, shard: 2, of: 3}
          - {part: eureka, shard: 3, of: 3}
          - {part: wince, shard: 1, of: 2}
          - {part: wince, shard: 2, of: 2}
          - {part: wink, shard: 1, of: 2}
          - {part: wink, shard: 2, of: 2}
    permissions:
      contents: read
      actions: read   # scripts/ci_budget.py reads the run's start
    outputs:
      cold: ${{ steps.cold.outputs.cold }}   # set by a shard that rendered (an empty output is never set)
    env:   # only the Stage a shard draws is baked (make trajectories): the gestures stage 1, the hero stage 3, views all
      TRAJ_DOCS: ${{ matrix.part == 'hero' && 'noggin-stage3' || matrix.part != 'views' && 'noggin-stage1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; the token stays out of what is uploaded
      # this shard's frames (model/build/pictures without the PLYs Blender read)
      - id: frames
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/pictures
            !model/build/pictures/meshes
          key: pictures-${{ matrix.part }}-${{ matrix.shard }}of${{ matrix.of }}-${{ hashFiles('model/**', '!model/build/**', 'eyes/**', 'Makefile', 'uv.lock', '.github/workflows/pages.yml') }}
      - if: ${{ steps.frames.outputs.cache-hit != 'true' }}
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78   # v7.6.0
        with:
          enable-cache: false   # as in check.yml
      # our built parts and the latest trajectories, as in viewer (whose make web then finds these trajectories fresh); the
      # trajectories need no convex pieces (mjcf.model collide=False: no CoACD on this path, #276)
      - if: ${{ steps.frames.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ours-convex-${{ hashFiles('model/printed/**', 'model/envelopes.py', 'model/geometry.py', 'model/ours.py', 'model/mjcf.py', 'model/stages.py', 'uv.lock') }}
          restore-keys: ours-convex-
      - if: ${{ steps.frames.outputs.cache-hit != 'true' }}
        id: trajectories
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/trajectories
          key: trajectories-${{ hashFiles('model/**', '!model/build/**', 'eyes/**', 'uv.lock') }}
          restore-keys: trajectories-
      # Blender 5.2.2 cached unpacked (the untar took ~20 s a runner); else the tarball's cache, fetched only when neither
      # is there: download.blender.org refused main's runners (403) on the first deploy; sha256-checked
      - if: ${{ steps.frames.outputs.cache-hit != 'true' }}
        id: blender
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: ~/blender
          key: blender-5.2.2-linux-x64-unpacked
      - if: ${{ steps.frames.outputs.cache-hit != 'true' && steps.blender.outputs.cache-hit != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: ~/blender.tar.xz
          key: blender-5.2.2-linux-x64
      - if: ${{ steps.frames.outputs.cache-hit != 'true' && steps.blender.outputs.cache-hit != 'true' }}
        run: |
          [ -f ~/blender.tar.xz ] || curl -fsSL -o ~/blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          echo "84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  $HOME/blender.tar.xz" | sha256sum -c
          mkdir ~/blender && tar -xJf ~/blender.tar.xz -C ~/blender --strip-components=1
      # Blender's X and GL libraries, even in the background (Eevee renders on Mesa's software GL here); all but libegl1
      # come with the runner image. No ffmpeg: its 100 packages took 20-90 s a runner (imageio-ffmpeg's, in the site job)
      - if: ${{ steps.frames.outputs.cache-hit != 'true' }}
        run: sudo apt-get update && sudo apt-get install -y libxi6 libxkbcommon0 libxxf86vm1 libxfixes3 libxrender1 libsm6 libgl1 libegl1 libgl1-mesa-dri
      # its own step first, so the run's timings show the bake apart from the renders
      - if: ${{ steps.frames.outputs.cache-hit != 'true' }}
        run: make trajectories
      - if: ${{ steps.frames.outputs.cache-hit != 'true' }}
        id: cold
        env:
          PARTS: ${{ matrix.part }}
          SHARD: ${{ matrix.shard }}/${{ matrix.of }}
        run: |
          make pictures BLENDER=$HOME/blender/blender
          echo "cold=true" >> "$GITHUB_OUTPUT"
      - if: ${{ always() && steps.frames.outputs.cache-hit != 'true' && steps.trajectories.outputs.cache-hit != 'true' && matrix.part == 'views' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/trajectories
          key: ${{ steps.trajectories.outputs.cache-primary-key }}
      - if: ${{ steps.frames.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/pictures
            !model/build/pictures/meshes
          key: ${{ steps.frames.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: frames-${{ matrix.part }}-${{ matrix.shard }}of${{ matrix.of }}
          path: |
            model/build/pictures
            !model/build/pictures/meshes
          if-no-files-found: error
      - run: python3 scripts/ci_budget.py ${{ steps.frames.outputs.cache-hit == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
  pictures:   # the required check (#245), render's runners under one name (as check.yml's model); render skipped passes
    if: ${{ !cancelled() }}
    needs: render
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.render.result }}
        run: test "$RESULT" = success || test "$RESULT" = skipped
  # the viewer (Blender's GLBs and three.js with its Draco decoder in web/build) built and tested by make web when what it
  # is made from changed, else the last one built from the same inputs: a docs-only change bakes nothing. Beside the
  # pictures, so neither waits for the other (#278)
  viewer:
    needs: changes
    if: >-   # as site
      ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.site != 'false'
      && github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # scripts/ci_budget.py reads the run's start
    outputs:
      warm: ${{ steps.viewer.outputs.cache-hit == 'true' || steps.trajectories.outputs.cache-hit == 'true' }}   # GLBs bake in ~40 s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; the token stays out of what is uploaded
      - id: viewer
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: web/build
          key: viewer-${{ hashFiles('model/**', '!model/build/**', 'eyes/**', 'web/**', 'vendored.py', 'Makefile', 'uv.lock', '.github/workflows/pages.yml') }}
      - if: ${{ steps.viewer.outputs.cache-hit != 'true' }}
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78   # v7.6.0
        with:
          enable-cache: false   # as in check.yml
      # three.js from npm (vendored.py's .cache) by its version in web/build.py; vendored.py checks each hash cached or not
      - if: ${{ steps.viewer.outputs.cache-hit != 'true' }}
        id: three
        run: echo "version=$(grep -oP '^THREE_VERSION = "\K[^"]+' web/build.py)" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.viewer.outputs.cache-hit != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: .cache/three@*
          key: npm-three-${{ steps.three.outputs.version }}
      # the check workflow's cache of our built parts (same key: its model job fills it); restore only, since a save here
      # would store the key without model/build/convex first and the check workflow's full save would be refused;
      # restore-keys as in check.yml: a part's own .key rebuilds only what changed. The latest trajectories: make web
      # rebakes only the Stages whose stamp moved (model/trajectories.py)
      - if: ${{ steps.viewer.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ours-convex-${{ hashFiles('model/printed/**', 'model/envelopes.py', 'model/geometry.py', 'model/ours.py', 'model/mjcf.py', 'model/stages.py', 'uv.lock') }}
          restore-keys: ours-convex-
      - if: ${{ steps.viewer.outputs.cache-hit != 'true' }}
        id: trajectories
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/trajectories
          key: trajectories-${{ hashFiles('model/**', '!model/build/**', 'eyes/**', 'uv.lock') }}
          restore-keys: trajectories-
      # Blender 5.2.2 cached unpacked (the untar took ~20 s a runner); else the tarball's cache, fetched only when neither
      # is there: download.blender.org refused main's runners (403) on the first deploy; sha256-checked
      - if: ${{ steps.viewer.outputs.cache-hit != 'true' }}
        id: blender
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: ~/blender
          key: blender-5.2.2-linux-x64-unpacked
      - if: ${{ steps.viewer.outputs.cache-hit != 'true' && steps.blender.outputs.cache-hit != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: ~/blender.tar.xz
          key: blender-5.2.2-linux-x64
      - if: ${{ steps.viewer.outputs.cache-hit != 'true' && steps.blender.outputs.cache-hit != 'true' }}
        run: |
          [ -f ~/blender.tar.xz ] || curl -fsSL -o ~/blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          echo "84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  $HOME/blender.tar.xz" | sha256sum -c
          mkdir ~/blender && tar -xJf ~/blender.tar.xz -C ~/blender --strip-components=1
      # Blender's X and GL libraries, even in the background; all but libegl1 come with the runner image
      - if: ${{ steps.viewer.outputs.cache-hit != 'true' }}
        run: sudo apt-get update && sudo apt-get install -y libxi6 libxkbcommon0 libxxf86vm1 libxfixes3 libxrender1 libsm6 libgl1 libegl1 libgl1-mesa-dri
      - if: ${{ steps.viewer.outputs.cache-hit != 'true' }}
        run: make web BLENDER=$HOME/blender/blender
      # saved even when a web test fails, as check.yml saves the parts: the baked trajectories stay good
      - if: ${{ always() && steps.viewer.outputs.cache-hit != 'true' && steps.trajectories.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/trajectories
          key: ${{ steps.trajectories.outputs.cache-primary-key }}
      - if: ${{ steps.viewer.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: web/build
          key: ${{ steps.viewer.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: viewer
          path: web/build
          if-no-files-found: error
      - run: python3 scripts/ci_budget.py ${{ steps.viewer.outputs.cache-hit == 'true' || steps.trajectories.outputs.cache-hit == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
  site:
    needs: [changes, render, viewer]
    if: >-   # as in mech.yml, plus the cancelled check run
      ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.site != 'false'
      && github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # scripts/ci_budget.py reads when the run's jobs started
    steps:
      # never a site without all its pictures and its viewer: the deploy would take them down (as on #236's first deploy)
      - if: ${{ needs.render.result != 'success' || needs.viewer.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; the token stays out of what is uploaded
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78   # v7.6.0
        with:
          enable-cache: false   # as in check.yml
      # every shard's frames, joined into the pictures (model/build/images, which make site puts at site/images)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          pattern: frames-*
          merge-multiple: true
          path: model/build/pictures
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: viewer
          path: web/build
      # Mermaid from npm (vendored.py's .cache) by its version in mkdocs.yml; vendored.py checks its hash cached or not
      - id: mermaid
        run: |   # its own assignment, so a failing yq fails the step
          version=$(yq -e .extra.mermaid.version mkdocs.yml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: .cache/mermaid@*
          key: npm-mermaid-${{ steps.mermaid.outputs.version }}
      # main's latest sim reports (check.yml's sim shard saves them on main), which make site publishes at /reports: no
      # entry carries this key, so the newest sim- entry is restored
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/reports
          key: sim-latest
          restore-keys: sim-
      - run: make venv && .venv/bin/python -m model.render.pictures join
      - run: make site
      - if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: site
      # the PR's preview: the built site and its pictures as artifacts, linked from the job summary
      - if: ${{ github.event_name == 'pull_request' }}
        id: preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: site
          path: site
      - if: ${{ github.event_name == 'pull_request' }}
        id: pictures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: pictures
          path: model/build/images
      - if: ${{ github.event_name == 'pull_request' }}
        env:
          URL: ${{ steps.preview.outputs.artifact-url }}
          PICTURES: ${{ steps.pictures.outputs.artifact-url }}
          BUILT: ${{ needs.render.outputs.cold == 'true' && 'rendered from this PR' || 'unchanged, the last build of the same inputs' }}
        run: |
          echo "Site preview with the web viewer: [the site artifact]($URL)," >> "$GITHUB_STEP_SUMMARY"
          echo 'unzip it and run `python -m http.server -d <folder>`.' >> "$GITHUB_STEP_SUMMARY"
          echo "Pictures ($BUILT): [the pictures artifact]($PICTURES), what the site serves at images/ once this lands." >> "$GITHUB_STEP_SUMMARY"
      # as in check.yml; warm: no shard of the pictures rendered and the viewer was warm (the budget counts from the
      # run's first job)
      - run: python3 scripts/ci_budget.py ${{ needs.render.outputs.cold != 'true' && needs.viewer.outputs.warm == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
  deploy:   # site's result, not the implicit success(): changes, skipped on main, would skip this too
    if: ${{ !cancelled() && needs.site.result == 'success' && github.event_name != 'pull_request' }}
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
