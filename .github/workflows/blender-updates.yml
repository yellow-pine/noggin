name: Blender Updates
# Re-pins Blender to the newest stable release at least 14 days old and opens (or refreshes) a PR, weekly.
# scripts/blender_pin.py (#334) rewrites the version and the Linux tarball's sha256 wherever the pin lives. It acts as
# the bot App (CONTRIBUTING.md): a PR opened with GITHUB_TOKEN starts no workflows
# (https://docs.github.com/en/actions/concepts/security/github_token).
run-name: "${{ github.event_name == 'schedule' && 'ci(ci): weekly Blender Updates re-pin' || format('ci(ci): manual Blender Updates run by {0}', github.actor) }}"
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
concurrency:   # the newest run wins: it re-pins from scratch
  group: ${{ github.workflow }}
  cancel-in-progress: true
permissions: {}
jobs:
  pin:
    name: Re-pin Blender
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Find the newest Blender
        id: pin
        # its own assignment, so a failed fetch or a hash the sources disagree on fails the step (inside echo's
        # arguments it would pass as "no change")
        run: |
          out=$(python3 scripts/blender_pin.py)
          v=${out%% *}
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Blender $v, the newest stable release at least 14 days old; sha256 from its .sha256, the same on each of: ${out#* } (Blender signs no checksums; compare https://download.blender.org/release/Blender${v%.*}/blender-$v.sha256). Release notes: https://www.blender.org/download/releases/$(echo "${v%.*}" | tr . -)/" > "$RUNNER_TEMP/body.md"
      # from main only (a dispatch elsewhere is a dry run): it would otherwise propose that branch's commits too
      - name: Mint the bot App's token
        id: app
        if: ${{ github.ref == 'refs/heads/main' && steps.pin.outputs.version != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510   # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write   # its own branch
          permission-pull-requests: write
      # create-pull-request rebuilds blender-bump from main each run and force-pushes it, its one ref
      - name: Open or refresh the PR
        if: ${{ github.ref == 'refs/heads/main' && steps.pin.outputs.version != '' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1   # v8.1.1
        with:
          token: ${{ steps.app.outputs.token }}
          branch: blender-bump
          commit-message: "ci(deps): re-pin Blender to ${{ steps.pin.outputs.version }}"
          title: "ci(deps): re-pin Blender to ${{ steps.pin.outputs.version }}"
          body-path: ${{ runner.temp }}/body.md
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
