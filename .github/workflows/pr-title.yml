name: PR Title
# A PR's title is its squash commit, which release-please reads (docs/adr/0010): a Conventional Commit; only the type
# is checked, a scope is free-form. Required check `PR Title`.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
concurrency:   # one run per PR; a new push or title edit cancels the one in progress
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  pull-requests: read
jobs:
  title:
    name: PR Title
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50   # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            docs
            ci
            build
            refactor
            test
            chore
