name: PR Title
# A PR's title is its squash commit, which release-please reads (docs/adr/0010): a Conventional Commit whose scope, if
# any, is one of the repo's areas (scripts/pr_scopes.py). Required check `PR Title`.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
concurrency:   # one run per PR; a new push or title edit cancels the one in progress
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  title:
    name: PR Title
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the scopes script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}   # main's script and areas, so a PR can't widen its own scopes
          persist-credentials: false
          sparse-checkout: scripts/pr_scopes.py   # git ls-files still lists every tracked file
          sparse-checkout-cone-mode: false
      - name: List the scopes
        id: scopes
        run: |
          { echo "scopes<<EOF"; python3 scripts/pr_scopes.py; echo EOF; } >> "$GITHUB_OUTPUT"
      - name: Check the title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50   # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            docs
            ci
            build
            refactor
            test
            chore
          scopes: ${{ steps.scopes.outputs.scopes }}
