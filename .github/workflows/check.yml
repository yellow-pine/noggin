name: Code Checks
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:   # one run per workflow and PR (or main): a new push cancels the one in progress, main runs its latest
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read   # scripts/ci_budget.py reads when the run's jobs started
defaults:
  run:
    shell: bash   # -eo pipefail: make's exit code survives the tee
# Three required checks side by side, so this workflow's conclusion on main is what Site Deploy waits for (#295): code
# runs everything but the tests marked model (pyproject.toml); mech the Link's live checks on the Mech stand-in; model
# passes when every model shard does, which split those tests (the hero's collision sweep alone, the rest by document
# over four, make view's offscreen render among them) and make sim (its own shard, when its inputs changed), with make
# stl and make step on main or when the parts changed. pytest runs on every core (xdist), its slowest tests go to the job
# summary, and each job ends on the budget (scripts/ci_budget.py): warm means the parts cache hit its exact key. A cold
# cache is cut part by part first (convex, #223), so the model shards start warm.
jobs:
  changes:   # what the PR touches (dorny/paths-filter: its files from the API, no checkout); only mech filters
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mech: ${{ steps.filter.outputs.mech }}
    steps:
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d   # v4.0.3
        with:   # Makefile: its MicroPython tag; pyproject: mpy-cross's pin
          filters: |
            mech: ["eyes/**", "noggin/**", "mech/**", "model/geometry.py", "Makefile", "pyproject.toml", ".github/workflows/check.yml"]
  # The Mech stand-in (mech/, #222): the Core's program on its MicroPython's unix port beside the real noggin service,
  # the Link's live checks on the Mech (docs/use/noggin-service.md) as tests. On PRs touching the Core's program, the
  # noggin service or the stand-in, and always on main. A required check: a job its condition skips reports success
  # (#245). Warm: the build's cache hit.
  mech:
    needs: changes
    # on main (changes skipped) or when changes failed too: only a clean "nothing touched" skips the work
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.mech != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3
        with:
          enable-cache: false   # uv sync downloads the wheels faster than the cache restores (#220)
      # the unix port and hmac (make mech/build/micropython), keyed on the MicroPython tag the Makefile pins
      - id: tag
        run: echo "tag=$(sed -n 's/^MICROPYTHON := //p' Makefile)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: mech/build
          key: micropython-unix-${{ steps.tag.outputs.tag }}
      - run: make mech | tee "$RUNNER_TEMP/pytest.txt"
        env:
          PYTEST_ADDOPTS: -n auto --durations=10
      - if: always()
        run: |
          { echo '```'; sed -n '/slowest .*durations/,/ in [0-9.]*s/p' "$RUNNER_TEMP/pytest.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - run: python3 scripts/ci_budget.py ${{ steps.build.outputs.cache-hit == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
  code:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      # no uv cache: pruned (the default) it held ~1 KB, unpruned 448 MB that restore in ~7 s, where uv sync downloads
      # every wheel in ~3 s (docs/research/2026-11-01-ci-budget.md)
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3
        with:
          enable-cache: false
      # restore only: this job never decomposes, so a save here would store the key without model/build/convex first
      # and the model job's full save would be refused (a key is written once). restore-keys: a PR that changes a part
      # starts from main's latest entry (a branch reads main's caches) and rebuilds only what its .key files miss
      - id: parts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ours-convex-${{ hashFiles('model/printed/**', 'model/envelopes.py', 'model/geometry.py', 'model/ours.py', 'model/mjcf.py', 'model/stages.py', 'uv.lock') }}
          restore-keys: ours-convex-
      # model/electrical.py's SPICE circuit: PySpice dlopens libngspice.so, the unversioned name only the -dev package
      # ships (https://packages.ubuntu.com/noble/amd64/libngspice0-dev/filelist)
      # and noggin/test_broker.py runs the real Mosquitto (https://packages.ubuntu.com/noble/mosquitto)
      - run: sudo apt-get update && sudo apt-get install -y libngspice0-dev mosquitto shellcheck
      # test_site.py draws the Mermaid diagrams in mermaid-cli's headless Chrome, whose sandbox needs the unprivileged user
      # namespaces Ubuntu 24.04's AppArmor turns off (https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md)
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # the site's Mermaid (vendored.py's .cache) and test_site.py's mermaid-cli (npx's install, Puppeteer's headless
      # shell), by their versions in mkdocs.yml: a miss downloads them, and vendored.py checks the hash cached or not
      - id: mermaid
        run: |   # its own line, so a failing yq fails the step
          v=$(yq -e '.extra.mermaid.version + "-cli-" + .extra.mermaid.cli' mkdocs.yml)
          echo "key=mermaid-npm-$v" >> "$GITHUB_OUTPUT"   # npm-: .cache mirrors npm's paths (#268)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            .cache
            ~/.npm/_npx
            ~/.cache/puppeteer
          key: ${{ steps.mermaid.outputs.key }}
      - run: make check | tee "$RUNNER_TEMP/pytest.txt"
        env:
          PUPPETEER_CHROME_SKIP_DOWNLOAD: true   # mermaid-cli runs the headless shell alone (docs/research: diagrams)
          PYTEST_ADDOPTS: -m "not model" -n auto --durations=20
          OMP_NUM_THREADS: 1   # one BLAS/OpenMP thread per xdist worker: 4 workers x 4 spinning threads starve each other
      - if: always()
        run: |
          { echo '```'; sed -n '/slowest .*durations/,/ in [0-9.]*s/p' "$RUNNER_TEMP/pytest.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # SC2329/SC2317 never-invoked wizard-library functions (code differs by shellcheck version), SC2012 ls glob on /dev, SC2015 A && B || C on purpose
      - run: shellcheck -e SC2329,SC2317,SC2012,SC2015 scripts/setup.sh noggin/hook.sh noggin/noggin
      - run: python3 scripts/ci_budget.py ${{ steps.parts.outputs.cache-hit == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
  convex:   # warm: only looks the parts cache up. Cold: from main's latest entry, lists the parts whose pieces are stale
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.parts.outputs.cache-primary-key }}
      parts: ${{ steps.stale.outputs.parts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - id: parts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ours-convex-${{ hashFiles('model/printed/**', 'model/envelopes.py', 'model/geometry.py', 'model/ours.py', 'model/mjcf.py', 'model/stages.py', 'uv.lock') }}
          lookup-only: true
      - if: ${{ steps.parts.outputs.cache-hit != 'true' }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3
        with:
          enable-cache: false   # as in code
      - if: ${{ steps.parts.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ${{ steps.parts.outputs.cache-primary-key }}
          restore-keys: ours-convex-   # as in code
      - if: ${{ steps.parts.outputs.cache-hit != 'true' }}
        id: stale
        run: |
          make ours
          parts=$(.venv/bin/python -m model.convex_parts)   # its own line, so a failure fails the step
          echo "parts=$parts" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.parts.outputs.cache-hit != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: ours
          path: model/build/ours/
          include-hidden-files: true   # its .key: make ours in the jobs below then builds nothing
          retention-days: 1
          overwrite: true   # a re-run of every job uploads it again
  convex-part:   # one stale part's pieces, cut on a runner of its own; the part's own cache saves a rerun the cut
    name: convex ${{ matrix.part }}
    needs: convex
    if: ${{ needs.convex.outputs.parts && needs.convex.outputs.parts != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # the parts that do cut keep their caches
      matrix:
        part: ${{ fromJSON(needs.convex.outputs.parts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3
        with:
          enable-cache: false   # as in code
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: ours
          path: model/build/ours
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/convex/${{ matrix.part }}
          key: convex-${{ matrix.part }}-${{ hashFiles(format('model/build/ours/{0}.stl', matrix.part), 'model/mjcf.py', 'model/stages.py', 'uv.lock') }}
      - run: make venv && .venv/bin/python -m model.convex_parts "$PART"   # after a hit, cuts only if its .key differs
        env:
          PART: ${{ matrix.part }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: convex-${{ matrix.part }}
          path: model/build/convex/   # this part's folder alone
          include-hidden-files: true   # its .key
          retention-days: 1
          overwrite: true   # as ours
  model-shard:
    name: model ${{ matrix.shard }}
    needs: [convex, convex-part]
    if: ${{ !cancelled() && !failure() && !github.event.pull_request.draft }}   # convex-part is skipped when warm
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # by document (pytest -k on its parameter id), each document's tests on one worker (--dist loadgroup): stage 2 and
      # stage 3 the longest, then the hero's sweep; a new model test lands in mujoco
      matrix:
        include:
          - shard: hero
            tests: model/render/test_hero.py
          - shard: mujoco
            tests: --ignore=model/render/test_hero.py -k "not stage2 and not stage3 and not mouth and not pan-tilt"
          - shard: mouth pan-tilt
            tests: --ignore=model/render/test_hero.py -k "mouth or pan-tilt"
          - shard: stage2
            tests: --ignore=model/render/test_hero.py -k stage2
          - shard: stage3
            tests: --ignore=model/render/test_hero.py -k stage3
          - shard: sim   # make sim, not make test (below)
    steps:
      # make sim's SPICE circuit (as in code; model/test_electrical.py runs it as mujoco collects it) and Mesa's EGL, which
      # renders make view's scene offscreen (MUJOCO_GL below) in software: installed while the job sets up, which pays
      # for the wait on convex
      - run: (sudo apt-get update && sudo apt-get install -y libngspice0-dev libegl1 libegl-mesa0 libgl1-mesa-dri; echo $? > "$RUNNER_TEMP/apt.rc") > "$RUNNER_TEMP/apt.txt" 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3
        with:
          enable-cache: false   # as in code
      # our built parts and their convex pieces: make ours rebuilds only when model/build/ours/.key no longer matches,
      # model/mjcf.py decomposes a part again only when its model/build/convex/<part>/.key does not (ours-convex-:
      # the old ours- entries on main were saved by pages without the pieces, so every run decomposed again)
      - id: parts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ${{ needs.convex.outputs.key }}
          restore-keys: ours-convex-   # as in code
      # missed: the parts convex built and cut over the entry restored
      - if: ${{ steps.parts.outputs.cache-hit != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: ours
          path: model/build/ours
      - if: ${{ steps.parts.outputs.cache-hit != 'true' }}   # a part cut again may have fewer pieces than restored
        run: jq -r '.[]' <<< "$PARTS" | while read -r part; do rm -rf "model/build/convex/$part"; done
        env:
          PARTS: ${{ needs.convex.outputs.parts }}
      - if: ${{ steps.parts.outputs.cache-hit != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          pattern: convex-*
          path: model/build/convex
          merge-multiple: true
      # missed the exact key: decompose what is still stale (nothing, after convex-part) before the tests, in mjcf's own
      # process pool, or several xdist workers would decompose the same part into the same folder at once
      - if: ${{ steps.parts.outputs.cache-hit != 'true' }}
        run: make ours && .venv/bin/python -m model.mjcf
      - run: |   # the install begun above
          make venv
          timeout 300 sh -c 'until [ -f "$RUNNER_TEMP/apt.rc" ]; do sleep 1; done' || echo "apt still running" > "$RUNNER_TEMP/apt.rc"
          [ "$(cat "$RUNNER_TEMP/apt.rc")" = 0 ] || { cat "$RUNNER_TEMP/apt.txt" "$RUNNER_TEMP/apt.rc"; exit 1; }
      - if: ${{ matrix.shard != 'sim' }}
        run: make test | tee "$RUNNER_TEMP/pytest.txt"
        env:
          PYTEST_ADDOPTS: -m model -n auto --dist loadgroup --durations=20 ${{ matrix.tests }}
          OMP_NUM_THREADS: 1   # as in code
          MUJOCO_GL: egl   # no display here (https://mujoco.readthedocs.io/en/stable/python.html#rendering)
      - if: ${{ always() && matrix.shard != 'sim' }}
        run: |
          { echo '```'; sed -n '/slowest .*durations/,/ in [0-9.]*s/p' "$RUNNER_TEMP/pytest.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # the print and FreeCAD exports as a smoke test, beside the short hero shard: on main, and on a PR whose parts
      # missed their exact key (what they are made from changed)
      - if: ${{ matrix.shard == 'hero' && (github.event_name == 'push' || steps.parts.outputs.cache-hit != 'true') }}
        run: make stl step
      # the sim reports (make sim on our parts and envelopes, model/build/reports, never committed: ADR 0009), keyed
      # on what they are made from (over-broad on purpose: any model module, the Makefile, this file). An exact hit is
      # main's reports for these very inputs, so the sim does not run; a miss restores main's latest reports (a PR reads
      # main's caches) as the baseline the new ones are diffed against in this job's summary. Main saves them for the
      # PRs after it and for the site, which publishes them at /reports (pages.yml)
      - if: ${{ matrix.shard == 'sim' }}
        id: reports
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/reports
          key: sim-${{ hashFiles('model/*.py', 'model/printed/*.py', 'model/render/scene.py', 'eyes/servo.py', 'uv.lock', 'Makefile', '.github/workflows/check.yml') }}
          restore-keys: sim-
      - if: ${{ matrix.shard == 'sim' && steps.reports.outputs.cache-hit != 'true' }}
        run: |
          [ ! -d model/build/reports ] || mv model/build/reports model/build/main-reports
          make sim
        env:
          OMP_NUM_THREADS: 1   # a document per process (model/report.py), as the xdist workers in make test
      - if: ${{ matrix.shard == 'sim' && steps.reports.outputs.cache-hit == 'true' }}
        run: |
          echo "### Sim inputs unchanged: main's reports for them stand, no sim ran" >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() && matrix.shard == 'sim' && steps.reports.outputs.cache-hit != 'true' }}
        run: |
          {
            echo "### Sim reports against main's latest"
            if [ ! -d model/build/main-reports ]; then echo "No reports of main's to diff against."
            elif d=$(diff -ru -x '*.xml' model/build/main-reports model/build/reports); then echo "No change."
            else printf '```diff\n%s\n```\n' "${d:0:900000}"   # the summary holds 1 MiB a step
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ matrix.shard == 'sim' && github.event_name == 'push' && steps.reports.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/reports
          key: ${{ steps.reports.outputs.cache-primary-key }}
      # saved even when a test or make sim fails (a red main would otherwise never fill its cache); an interrupted build
      # is safe to keep, since each .key above is written last
      - if: ${{ always() && steps.parts.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ${{ steps.parts.outputs.cache-primary-key }}
      - run: python3 scripts/ci_budget.py ${{ steps.parts.outputs.cache-hit == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
  model:   # the required check: a skipped shard would count as passing, so the shards' result is checked (not on cancel)
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    needs: model-shard
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.model-shard.result }}" = success ]'
