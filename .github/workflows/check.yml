name: Code Checks
# Runs `make check`, the Link's live checks on the Mech stand-in (`make mech`), the model tests, sim and STL/STEP export
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:   # one run per workflow and PR (or main): a new push cancels the one in progress, main runs its latest
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read   # scripts/ci_budget.py reads when the run's jobs started
defaults:
  run:
    shell: bash   # -eo pipefail: make's exit code survives the tee
# Three required checks side by side, so this workflow's conclusion on main is one of the two Site Deploy waits for
# (#295, #310): code runs everything but the tests marked model (pyproject.toml); mech the Link's live checks on the
# Mech stand-in; model, on a PR touching the model's inputs and always on main (#402),
# passes when every model shard does, which split those tests (the hero's collision sweep alone, the rest by document,
# the shards read from the code: model/shards.py; make view's offscreen render among them) and make sim (its own shard, when its inputs changed), with make
# stl and make step on main or when the parts changed. pytest runs on every core (xdist), its slowest tests go to the job
# summary, and each job ends on the budget (scripts/ci_budget.py): warm means the parts cache hit its exact key. A cold
# cache is cut part by part first (convex, #223), so the model shards start warm.
jobs:
  changes:   # what the PR touches (dorny/paths-filter: its files from the API, no checkout): mech's and model's inputs
    name: Changes
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mech: ${{ steps.filter.outputs.mech }}
      model: ${{ steps.filter.outputs.model }}
    steps:
      - name: Filter the changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d   # v4.0.3
        with:   # mech: the Makefile's MicroPython tag, pyproject's mpy-cross pin; model: test_derived.py's MADE_FROM says why
          filters: |
            mech: ["eyes/**", "noggin/**", "reactions/**", "mech/**", "model/geometry.py", "Makefile", "pyproject.toml", ".github/workflows/check.yml"]
            model: ["model/**", "eyes/**", "conftest.py", "scripts/heavy.py", "scripts/inputs.py", "pyproject.toml", "uv.lock", ".python-version", "Makefile", ".github/workflows/check.yml"]
  # The Mech stand-in (mech/, #222): the Core's program on its MicroPython's unix port beside the real noggin service,
  # the Link's live checks on the Mech (docs/use/noggin-service.md) as tests. On PRs touching the Core's program, the
  # noggin service or the stand-in, and always on main. A required check: a job its condition skips reports success
  # (#245). Warm: the build's cache hit.
  mech:
    name: Mech
    needs: changes
    # on main (changes skipped) or when changes failed too: only a clean "nothing touched" skips the work
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.mech != 'false' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3
        with:
          enable-cache: false   # uv sync downloads the wheels faster than the cache restores (#220)
      # the unix port and hmac (make mech/build/micropython), keyed on the MicroPython tag the Makefile pins
      - name: Read the MicroPython tag
        id: tag
        run: echo "tag=$(sed -n 's/^MICROPYTHON := //p' Makefile)" >> "$GITHUB_OUTPUT"
      - name: Restore the MicroPython build
        id: build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: mech/build
          key: micropython-unix-${{ steps.tag.outputs.tag }}
      - name: Run make mech
        run: make mech | tee "$RUNNER_TEMP/pytest.txt"
        env:
          PYTEST_ADDOPTS: -n auto --durations=10
      - name: List the slowest tests
        if: always()
        run: |
          { echo '```'; sed -n '/slowest .*durations/,/ in [0-9.]*s/p' "$RUNNER_TEMP/pytest.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Check the CI budget
        run: python3 scripts/ci_budget.py ${{ steps.build.outputs.cache-hit == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
  images:   # the CI images' digests (ci/pins/Dockerfile, where Dependabot bumps them, #444)
    name: Images
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      base: ${{ steps.pins.outputs.base }}
      blender: ${{ steps.pins.outputs.blender }}
    steps:
      - name: Check out the pins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          sparse-checkout: ci/pins/Dockerfile
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Read the pins
        id: pins
        run: awk '$1 == "FROM" { print $4 "=" $2 }' ci/pins/Dockerfile >> "$GITHUB_OUTPUT"
  code:
    name: Code
    needs: images
    # !cancelled(): a failed images fails code rather than skipping it, which a required check counts as passing; an
    # empty image would run it on the bare runner, so 'no-image' (a pull that fails) stands in
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    # uv, ngspice (model/electrical.py's SPICE circuit, which spicelib runs in batch mode), shellcheck, gh and yq
    container:
      image: ${{ needs.images.outputs.base || 'no-image' }}   # ci/base.Dockerfile (images.yml)
      env:   # uv's cache on the checkout's mount (/__w), so uv sync hard-links the venv: copying it took ~25 s
        UV_CACHE_DIR: /__w/uv-cache
        UV_LINK_MODE: hardlink
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes
      - name: Hash the lockfile
        id: lock
        run: |   # uv.lock minus noggin's version, which a release bumps (#403); a failing script fails the step
          hash=$(python3 scripts/lock_hash.py)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      # restore only: this job never decomposes, so a save here would store the key without model/build/convex first
      # and the model job's full save would be refused (a key is written once). restore-keys: a PR that changes a part
      # starts from main's latest entry (a branch reads main's caches) and rebuilds only what its .key files miss
      - name: Restore the parts cache
        id: parts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ours-convex-${{ hashFiles('model/printed/**', 'model/render/scene.py', 'model/envelopes.py', 'model/fits.py', 'model/geometry.py', 'model/linkage.py', 'model/ours.py', 'model/mjcf.py', 'model/stages.py') }}-${{ steps.lock.outputs.hash }}
          restore-keys: ours-convex-
      - name: Run make check
        run: make check | tee "$RUNNER_TEMP/pytest.txt"
        env:
          PYTEST_ADDOPTS: -m "not model" -n auto --durations=20
          OMP_NUM_THREADS: 1   # one BLAS/OpenMP thread per xdist worker: 4 workers x 4 spinning threads starve each other
      - name: List the slowest tests
        if: always()
        run: |
          { echo '```'; sed -n '/slowest .*durations/,/ in [0-9.]*s/p' "$RUNNER_TEMP/pytest.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # SC2329/SC2317 never-invoked wizard-library functions (code differs by shellcheck version), SC2012 ls glob on /dev, SC2015 A && B || C on purpose
      - name: Run shellcheck
        run: shellcheck -e SC2329,SC2317,SC2012,SC2015 scripts/setup.sh noggin/hook.sh noggin/noggin
      # a renamed job strands its old name in main's ruleset, where every PR then waits on it (#450)
      - name: Check the required checks
        run: |
          gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" \
            --jq '.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context' \
            | .venv/bin/python scripts/required_checks.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check the CI budget
        run: python3 scripts/ci_budget.py ${{ steps.parts.outputs.cache-hit == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
  # Convex, Shards and the model shards: on main (changes skipped) and on a PR touching the model's inputs, as mech
  convex:   # warm: only looks the parts cache up. Cold: from main's latest entry, lists the parts whose pieces are stale
    name: Convex
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.model != 'false' }}
    runs-on: ubuntu-26.04
    outputs:
      key: ${{ steps.parts.outputs.cache-primary-key }}
      parts: ${{ steps.stale.outputs.parts }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes
      - name: Hash the lockfile
        id: lock
        run: |   # uv.lock minus noggin's version, which a release bumps (#403); a failing script fails the step
          hash=$(python3 scripts/lock_hash.py)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - name: Look up the parts cache
        id: parts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ours-convex-${{ hashFiles('model/printed/**', 'model/render/scene.py', 'model/envelopes.py', 'model/fits.py', 'model/geometry.py', 'model/linkage.py', 'model/ours.py', 'model/mjcf.py', 'model/stages.py') }}-${{ steps.lock.outputs.hash }}
          lookup-only: true
      # no uv cache: pruned (the default) it held ~1 KB, unpruned 448 MB that restore in ~7 s, where uv sync downloads
      # every wheel in ~3 s (docs/research/2026-11-01-ci-budget.md)
      - name: Set up uv
        if: ${{ steps.parts.outputs.cache-hit != 'true' }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3
        with:
          enable-cache: false
      - name: Restore main's latest parts
        if: ${{ steps.parts.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ${{ steps.parts.outputs.cache-primary-key }}
          restore-keys: ours-convex-   # as in code
      - name: List the stale parts
        if: ${{ steps.parts.outputs.cache-hit != 'true' }}
        id: stale
        run: |
          make ours
          parts=$(.venv/bin/python -m model.convex_parts)   # its own line, so a failure fails the step
          echo "parts=$parts" >> "$GITHUB_OUTPUT"
      - name: Upload our built parts
        if: ${{ steps.parts.outputs.cache-hit != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: ours
          path: model/build/ours/
          include-hidden-files: true   # its .key: make ours in the jobs below then builds nothing
          retention-days: 1
          overwrite: true   # a re-run of every job uploads it again
  convex-part:   # one stale part's pieces, cut on a runner of its own; the part's own cache saves a rerun the cut
    name: Convex (${{ matrix.part }})
    needs: convex
    # !cancelled(): the implicit success() would skip it on main, where changes (convex's need) is skipped
    if: ${{ !cancelled() && needs.convex.result == 'success' && needs.convex.outputs.parts && needs.convex.outputs.parts != '[]' }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false   # the parts that do cut keep their caches
      matrix:
        part: ${{ fromJSON(needs.convex.outputs.parts) }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes
      - name: Hash the lockfile
        id: lock
        run: |   # uv.lock minus noggin's version, which a release bumps (#403); a failing script fails the step
          hash=$(python3 scripts/lock_hash.py)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3
        with:
          enable-cache: false   # as in convex
      - name: Download our built parts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: ours
          path: model/build/ours
      - name: Cache this part's pieces
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/convex/${{ matrix.part }}
          key: convex-${{ matrix.part }}-${{ hashFiles(format('model/build/ours/{0}.stl', matrix.part), 'model/mjcf.py', 'model/stages.py') }}-${{ steps.lock.outputs.hash }}
      - name: Cut the part
        run: make venv && .venv/bin/python -m model.convex_parts "$PART"   # after a hit, cuts only if its .key differs
        env:
          PART: ${{ matrix.part }}
      - name: Upload the part's pieces
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: convex-${{ matrix.part }}
          path: model/build/convex/   # this part's folder alone
          include-hidden-files: true   # its .key
          retention-days: 1
          overwrite: true   # as ours
  # model-shard's matrix from the code (make model-shards-list, model/shards.py): a new document needs no edit here
  shards:
    name: Shards
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.model != 'false' }}
    runs-on: ubuntu-26.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3
        with:
          enable-cache: false   # as in code
      - name: List the shards
        id: list
        run: |   # its own assignment, so a failing make fails the step
          list=$(make -s model-shards-list)
          echo "list=$list" >> "$GITHUB_OUTPUT"
  model-shard:
    name: Model (${{ matrix.shard }})
    needs: [convex, convex-part, shards]
    # convex-part is skipped when warm; shards succeeded: not a draft, and the model's inputs changed or this is main.
    # Its needs by name, not !failure(), which a failed changes (an ancestor) would trip, as mech runs on then
    if: >-
      ${{ !cancelled() && needs.shards.result == 'success' && needs.convex.result == 'success'
      && needs.convex-part.result != 'failure' }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      # by document (pytest -k on its parameter id), each document's tests on one worker (--dist loadgroup): the hero's
      # sweep alone, the recorded sweep documents, each Stage, the rest, and make sim (model/shards.py)
      matrix:
        include: ${{ fromJSON(needs.shards.outputs.list) }}   # {shard, tests} (model/test_shards.py)
    steps:
      # make sim's SPICE circuit (model/electrical.py; model/test_electrical.py runs it as mujoco collects it) and
      # Mesa's EGL, which renders make view's scene offscreen (MUJOCO_GL below) in software: installed while the job
      # sets up, which pays for the wait on convex
      - name: Install ngspice and EGL
        run: (sudo apt-get update && sudo apt-get install -y ngspice libegl1 libegl-mesa0 libgl1-mesa-dri; echo $? > "$RUNNER_TEMP/apt.rc") > "$RUNNER_TEMP/apt.txt" 2>&1 &
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes
      - name: Hash the lockfile
        id: lock
        run: |   # uv.lock minus noggin's version, which a release bumps (#403); a failing script fails the step
          hash=$(python3 scripts/lock_hash.py)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3
        with:
          enable-cache: false   # as in convex
      # our built parts and their convex pieces: make ours rebuilds only when model/build/ours/.key no longer matches,
      # model/mjcf.py decomposes a part again only when its model/build/convex/<part>/.key does not (ours-convex-:
      # the old ours- entries on main were saved by pages without the pieces, so every run decomposed again)
      - name: Restore the parts cache
        id: parts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ${{ needs.convex.outputs.key }}
          restore-keys: ours-convex-   # as in code
      # missed: the parts convex built and cut over the entry restored
      - name: Download our built parts
        if: ${{ steps.parts.outputs.cache-hit != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: ours
          path: model/build/ours
      - name: Drop the parts cut again
        if: ${{ steps.parts.outputs.cache-hit != 'true' }}   # a part cut again may have fewer pieces than restored
        run: jq -r '.[]' <<< "$PARTS" | while read -r part; do rm -rf "model/build/convex/$part"; done
        env:
          PARTS: ${{ needs.convex.outputs.parts }}
      - name: Download the cut pieces
        if: ${{ steps.parts.outputs.cache-hit != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          pattern: convex-*
          path: model/build/convex
          merge-multiple: true
      # missed the exact key: decompose what is still stale (nothing, after convex-part) before the tests, in mjcf's own
      # process pool, or several xdist workers would decompose the same part into the same folder at once
      - name: Rebuild and cut what is stale
        if: ${{ steps.parts.outputs.cache-hit != 'true' }}
        run: make ours && .venv/bin/python -m model.mjcf
      - name: Make the venv, wait for apt
        run: |   # the install begun above
          make venv
          timeout 300 sh -c 'until [ -f "$RUNNER_TEMP/apt.rc" ]; do sleep 1; done' || echo "apt still running" > "$RUNNER_TEMP/apt.rc"
          [ "$(cat "$RUNNER_TEMP/apt.rc")" = 0 ] || { cat "$RUNNER_TEMP/apt.txt" "$RUNNER_TEMP/apt.rc"; exit 1; }
      - name: Run make test
        if: ${{ matrix.shard != 'sim' }}
        run: make test | tee "$RUNNER_TEMP/pytest.txt"
        env:
          PYTEST_ADDOPTS: -m model -n auto --dist loadgroup --durations=20 ${{ matrix.tests }}
          OMP_NUM_THREADS: 1   # as in code
          MUJOCO_GL: egl   # no display here (https://mujoco.readthedocs.io/en/stable/python.html#rendering)
      - name: List the slowest tests
        if: ${{ always() && matrix.shard != 'sim' }}
        run: |
          { echo '```'; sed -n '/slowest .*durations/,/ in [0-9.]*s/p' "$RUNNER_TEMP/pytest.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # the print and FreeCAD exports as a smoke test, beside the short hero shard: on main, and on a PR whose parts
      # missed their exact key (what they are made from changed)
      - name: Run make stl step
        if: ${{ matrix.shard == 'hero' && (github.event_name == 'push' || steps.parts.outputs.cache-hit != 'true') }}
        run: make stl step
      # the sim reports (make sim on our parts and envelopes, model/build/reports, never committed: ADR 0009), keyed
      # on what they are made from (over-broad on purpose: any model module, the Makefile, this file). An exact hit is
      # main's reports for these very inputs, so the sim does not run; a miss restores main's latest reports (a PR reads
      # main's caches) as the baseline the new ones are diffed against in this job's summary. Main saves them for the
      # PRs after it and for the site, which publishes them at /reports (Site Deploy, pages.yml)
      - name: Restore the sim reports
        if: ${{ matrix.shard == 'sim' }}
        id: reports
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/reports
          key: sim-${{ hashFiles('model/*.py', 'model/printed/*.py', 'model/render/scene.py', 'eyes/servo.py', 'Makefile', '.github/workflows/check.yml') }}-${{ steps.lock.outputs.hash }}
          restore-keys: sim-
      - name: Run make sim
        if: ${{ matrix.shard == 'sim' && steps.reports.outputs.cache-hit != 'true' }}
        run: |
          [ ! -d model/build/reports ] || mv model/build/reports model/build/main-reports
          make sim
        env:
          OMP_NUM_THREADS: 1   # a document per process (model/report.py), as the xdist workers in make test
      - name: Report the sim inputs unchanged
        if: ${{ matrix.shard == 'sim' && steps.reports.outputs.cache-hit == 'true' }}
        run: |
          echo "### Sim inputs unchanged: main's reports for them stand, no sim ran" >> "$GITHUB_STEP_SUMMARY"
      - name: Diff the reports against main's
        if: ${{ !cancelled() && matrix.shard == 'sim' && steps.reports.outputs.cache-hit != 'true' }}
        run: |
          {
            echo "### Sim reports against main's latest"
            if [ ! -d model/build/main-reports ]; then echo "No reports of main's to diff against."
            elif d=$(diff -ru -x '*.xml' model/build/main-reports model/build/reports); then echo "No change."
            else printf '```diff\n%s\n```\n' "${d:0:900000}"   # the summary holds 1 MiB a step
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save the sim reports
        if: ${{ matrix.shard == 'sim' && github.event_name == 'push' && steps.reports.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/reports
          key: ${{ steps.reports.outputs.cache-primary-key }}
      # saved even when a test or make sim fails (a red main would otherwise never fill its cache); an interrupted build
      # is safe to keep, since each .key above is written last
      - name: Save the parts cache
        if: ${{ always() && steps.parts.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            model/build/ours
            model/build/convex
          key: ${{ steps.parts.outputs.cache-primary-key }}
      - name: Check the CI budget
        run: python3 scripts/ci_budget.py ${{ steps.parts.outputs.cache-hit == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
  # the required check: a skipped shard would count as passing, so the shards' result is checked (not on cancel); they
  # may skip only when the PR leaves the model's inputs alone
  model:
    name: Model
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    needs: [changes, model-shard]
    runs-on: ubuntu-26.04
    steps:
      - name: Check every shard passed
        env:
          RESULT: ${{ needs.model-shard.result }}
          MODEL: ${{ needs.changes.outputs.model }}
        run: test "$RESULT" = success || { test "$RESULT" = skipped && test "$MODEL" = false; }
