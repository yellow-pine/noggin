name: check
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:   # one run per workflow and PR (or branch); a new push to a PR cancels the one in progress, main runs all
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/cache@v6   # our built parts: make ours rebuilds only when model/build/ours/.key no longer matches
        with:
          path: model/build/ours
          key: ours-${{ hashFiles('model/printed/**', 'model/envelopes.py', 'model/geometry.py', 'model/ours.py', 'uv.lock') }}
      - run: make check
      # on our own parts and hardware envelopes (model/ours.py); a PR whose committed report stamps still match skips
      # it (make sim-if-stale), main always runs it
      - run: make ${{ github.event_name == 'push' && 'sim' || 'sim-if-stale' }}
      - run: sudo apt-get install -y shellcheck
      # SC2329/SC2317 never-invoked wizard-library functions (code differs by shellcheck version), SC2012 ls glob on /dev, SC2015 A && B || C on purpose
      - run: shellcheck -e SC2329,SC2317,SC2012,SC2015 scripts/setup.sh noggin/hook.sh noggin/noggin
