name: release
on:
  push:
    tags: ["v*"]
concurrency:   # one run per tag, never cancelled
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      # the Core program files that `make flash` copies, plus the setup wizard
      - run: zip noggin-${{ github.ref_name }}.zip eyes/eyes.py eyes/gaze_trace.py eyes/wifi.py eyes/boot.py scripts/setup.sh README.md LICENSE.md
      - run: gh release create ${{ github.ref_name }} noggin-${{ github.ref_name }}.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
