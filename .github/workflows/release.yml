name: Release Assets
on:
  push:
    tags: ["v*"]
concurrency:   # one run per tag, never cancelled
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      # the eye program's files that `make flash` copies (make mpy-list, no venv here; the assignment fails with make),
      # stamped with this release's version and commit as make mpy does (stamp.py, beside them), plus the setup wizard
      - run: |
          program=$(make -s mpy-list PY=python3)
          python3 -m noggin.core stamp > eyes/stamp.py
          zip noggin-${{ github.ref_name }}.zip $program eyes/stamp.py eyes/boot.py scripts/setup.sh README.md LICENSE.md
      # release-please made the release with this tag and its CHANGELOG.md entry (docs/adr/0010): attach the zip
      - run: gh release upload "$TAG" "noggin-$TAG.zip" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
