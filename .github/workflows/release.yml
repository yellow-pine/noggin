name: Release Assets
on:
  push:
    tags: ["v*"]
concurrency:   # one run per tag, never cancelled
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      # the Core program files that `make flash` copies, plus the setup wizard
      - run: zip noggin-${{ github.ref_name }}.zip eyes/eyes.py eyes/gaze_trace.py eyes/wifi.py eyes/boot.py scripts/setup.sh README.md LICENSE.md
      # release-please made the release with this tag and its CHANGELOG.md entry (docs/adr/0010): attach the zip
      - run: gh release upload "$TAG" "noggin-$TAG.zip" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
