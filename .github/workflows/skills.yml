name: Skills Updates
# Re-pins skills-lock.json to each source's HEAD and opens (or refreshes) a PR, weekly.
# The reviewer's skills thus change only through a reviewed PR. It acts as the bot App (CONTRIBUTING.md): a PR opened
# with GITHUB_TOKEN starts no workflows (https://docs.github.com/en/actions/concepts/security/github_token).
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
concurrency:   # the newest run wins: it re-pins from scratch
  group: ${{ github.workflow }}
  cancel-in-progress: true
permissions: {}
jobs:
  lock:
    name: Re-pin Skills
    # the skills CLI (ci/package-lock.json) runs here with no token or secrets
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Install the skills CLI
        run: npm ci --prefix ci --ignore-scripts --no-audit --no-fund
      # `skills add <source>#<sha>` rewrites each entry's ref and computedHash in the CLI's own lock format
      - name: Re-pin each source
        run: |
          for src in $(jq -r '[.skills[].source] | unique[]' skills-lock.json); do
            sha=$(git ls-remote "https://github.com/$src" HEAD | cut -f1)
            ci/node_modules/.bin/skills add "$src#$sha" -a universal -y \
              --skill $(jq -r --arg s "$src" '.skills | to_entries[] | select(.value.source == $s).key' skills-lock.json)
          done
          node scripts/verify_skills.mjs
      - name: Upload the lock
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: lock
          path: skills-lock.json
  pr:
    name: Propose
    needs: lock
    # from main only (a dispatch elsewhere is a dry run): it would otherwise propose that branch's commits too
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Download the lock
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: lock
          path: ${{ runner.temp }}/lock
      # the artifact comes from the job that ran the skills CLI: take its one file, and only if it changes nothing but each
      # entry's ref (a commit) and computedHash (a sha256)
      - name: Take the lock if only pins moved
        run: |
          [ "$(ls -A "$RUNNER_TEMP/lock")" = skills-lock.json ]
          jq -e --slurpfile n "$RUNNER_TEMP/lock/skills-lock.json" '
            def shape: del(.skills[].ref, .skills[].computedHash);
            shape == ($n[0] | shape) and ($n[0].skills | all(
              (.ref | test("^[0-9a-f]{40}$")) and (.computedHash | test("^[0-9a-f]{64}$"))))' skills-lock.json
          cp skills-lock.json "$RUNNER_TEMP/old.json"
          cp "$RUNNER_TEMP/lock/skills-lock.json" skills-lock.json
      # one compare link per moved source, so the review reads the upstream change, not just new SHAs
      - name: Write the PR's body
        run: |
          jq -rn --slurpfile o "$RUNNER_TEMP/old.json" --slurpfile n skills-lock.json '
            ($o[0].skills | map({(.source): .ref}) | add) as $old | $n[0].skills | map({(.source): .ref}) | add
            | to_entries[] | select($old[.key] != .value) | "- https://github.com/\(.key)/compare/\($old[.key])...\(.value)"' > "$RUNNER_TEMP/body.md"
      - name: Mint the bot App's token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510   # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write   # its own branch
          permission-pull-requests: write
      # no diff, no PR; else it rebuilds skills-bump from main each run and force-pushes it, its one ref
      - name: Open or refresh the PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1   # v8.1.1
        with:
          token: ${{ steps.app.outputs.token }}
          branch: skills-bump
          add-paths: skills-lock.json
          commit-message: "build(deps): re-pin skills-lock.json to upstream HEAD"
          title: "build(deps): re-pin skills-lock.json to upstream HEAD"
          body-path: ${{ runner.temp }}/body.md
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
