name: CodeQL
# Scans main with CodeQL weekly (and on demand) into the Security tab; a finding gets a follow-up PR.
# Not on PRs (#560): waiting on code scanning results stalled them, so main's ruleset no longer requires them. Not on
# every push to main (#728): ~40 runs a day found two alerts ever, both won't-fix; ruff, pyright and zizmor cover the
# Python and the workflows on each push. Advanced setup (#549): one job runs the three languages in turn (init takes
# several, analyze uploads one result per language), none of which needs a build. Default setup is off: GitHub rejects
# an advanced setup's uploads while it is on.
run-name: "${{ github.event_name == 'schedule' && 'ci(ci): weekly CodeQL scan' || format('ci(ci): manual CodeQL run by {0}', github.actor) }}"
on:
  schedule:
    - cron: "0 4 * * 1"   # Mondays
  workflow_dispatch:
permissions: {}
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write   # upload the results to code scanning
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Set up CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370   # v4.39.1
        with:
          languages: actions, javascript-typescript, python
          build-mode: none
      - name: Run CodeQL
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370   # v4.39.1
