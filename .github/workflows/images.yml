name: CI Images
# Our CI images (ci/, docs/adr/0009, #288): ghcr.io/yellow-pine/noggin-ci-base and -blender (base plus Blender), which
# the jobs needing Chrome or Blender run in by digest (`container:`). Only main writes to the registry: on a push that changes a
# Dockerfile, every Monday with no cache (the distro's security fixes) and on a dispatch from main, it pushes both as
# :main with their build provenance (GitHub's attestations) and refreshes the layer cache; Dependabot (docker,
# .github/workflows) then proposes the new digests as a PR, whose checks run in them before any job on main does. A PR
# that changes a Dockerfile builds both from main's cache, read only, and pushes nothing.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["ci/*.Dockerfile", ".github/workflows/images.yml"]
  push:
    branches: [main]
    paths: ["ci/*.Dockerfile", ".github/workflows/images.yml"]
  schedule:
    - cron: "0 4 * * 1"   # Mondays
  workflow_dispatch:
concurrency:   # as in check.yml
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions: {}
env:
  REPO: ghcr.io/yellow-pine/noggin-ci
jobs:
  build:   # a PR: both images built, base handed to -blender as an OCI layout, nothing pushed
    name: Build
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1
      - name: Build the base image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: ci
          file: ci/base.Dockerfile
          tags: base:pr
          outputs: type=oci,dest=${{ runner.temp }}/base,tar=false
          cache-from: type=registry,ref=${{ env.REPO }}-base:cache
      - name: Build the Blender image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: ci
          file: ci/blender.Dockerfile
          build-args: BASE=base
          build-contexts: base=oci-layout://${{ runner.temp }}/base:pr
          outputs: type=cacheonly
          cache-from: type=registry,ref=${{ env.REPO }}-blender:cache
  push:
    name: Push
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # the only job that writes to GHCR
      id-token: write   # the provenance attestations
      attestations: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6   # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # zstd layers unpack faster where each job pulls them; the registry cache keeps every stage's layers (mode=max)
      - name: Push the base image
        id: base
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: ci
          file: ci/base.Dockerfile
          tags: ${{ env.REPO }}-base:main
          outputs: type=image,push=true,compression=zstd,force-compression=true
          provenance: false   # one manifest, whose digest the jobs pin; the attestation below is GitHub's
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=registry,ref=${{ env.REPO }}-base:cache
          cache-to: type=registry,ref=${{ env.REPO }}-base:cache,mode=max
      - name: Push the Blender image
        id: blender
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: ci
          file: ci/blender.Dockerfile
          build-args: BASE=${{ env.REPO }}-base@${{ steps.base.outputs.digest }}
          tags: ${{ env.REPO }}-blender:main
          outputs: type=image,push=true,compression=zstd,force-compression=true
          provenance: false
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=registry,ref=${{ env.REPO }}-blender:cache
          cache-to: type=registry,ref=${{ env.REPO }}-blender:cache,mode=max
      - name: Attest the base image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8   # v4.2.2
        with:
          subject-name: ${{ env.REPO }}-base
          subject-digest: ${{ steps.base.outputs.digest }}
          push-to-registry: true
      - name: Attest the Blender image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8   # v4.2.2
        with:
          subject-name: ${{ env.REPO }}-blender
          subject-digest: ${{ steps.blender.outputs.digest }}
          push-to-registry: true
      # Dependabot proposes these digests within a day; the same pin by hand, for a PR that can't wait for it
      - name: Write the pins to the summary
        env:
          BASE: ${{ steps.base.outputs.digest }}
          BLENDER: ${{ steps.blender.outputs.digest }}
        run: |
          {
            echo "### Pushed $REPO-base:main and $REPO-blender:main"
            echo '```sh'
            echo "perl -pi -e 's|($REPO-base:main@)sha256:[0-9a-f]{64}|\${1}$BASE|; s|($REPO-blender:main@)sha256:[0-9a-f]{64}|\${1}$BLENDER|' .github/workflows/*.yml"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
