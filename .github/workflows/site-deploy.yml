name: Site Deploy
# Deploys the site artifact Checks built once main's checks pass.
# Main's site on GitHub Pages (yellowpine.com/noggin/, docs/adr/0009) is built once: Checks (checks.yml) builds and
# tests it on main, and this deploys a main commit's site artifact once its Checks passed (#310, #496), with
# no rebuild, from the Checks run that completed (#731). `Deploy` swaps in main's newest sim reports (Checks builds the
# site beside the sim) and deploys the latest docs alone (docs/adr/0021); red or cancelled Checks
# deploy nothing and leave the last site up, and Main Red (main-red.yml) reports a red run. Pages' source is GitHub
# Actions (POST /repos/{owner}/{repo}/pages, build_type=workflow); the github-pages environment lists each deploy with
# its URL in the repo's Deployments panel. It acts only for this repository's push to main (branches: [main] alone
# also matches a fork's PR from a branch named main), on that push's commit (head_sha).
run-name: "${{ format('Site Deploy: {0}', github.event.workflow_run.display_title) }}"
on:
  workflow_run:   # zizmor: ignore[dangerous-triggers] the Deploy job acts only on this repo's push to main
    workflows: ["Checks"]   # by its name (test_workflows.py)
    types: [completed]
    branches: [main]
permissions: {}
env:   # the commit it deploys: the completed check run's
  SHA: ${{ github.event.workflow_run.head_sha }}
jobs:
  deploy:
    name: Deploy
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository }}
    # one deploy at a time; a newer one waiting cancels an older waiting one, so main ends on its latest. Not in
    # progress: a deploy is a minute, and the same commit may come twice (both workflows completing together)
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read   # Checks' runs and artifact
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the deploy's script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ env.SHA }}
          sparse-checkout: scripts/site_reports.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false   # nothing here pushes; the token stays out of what is uploaded
      - name: Download the site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: site
          path: site/dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # main's latest sim reports, which Checks' sim shard has saved by now (newest sim- entry, as in Checks' Site)
      - name: Restore main's sim reports
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: model/build/reports
          key: sim-latest
          restore-keys: sim-
      - name: Add the sim reports
        run: scripts/site_reports.sh   # just site-reports, without setting up just
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: site/dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
