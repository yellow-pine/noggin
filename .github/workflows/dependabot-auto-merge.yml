name: Dependabot Auto-merge
# Turns on auto-merge (squash) for Dependabot's PRs: each merges once the required checks and Claude's review pass.
# Majors too: auto-merge waits for main's ruleset (the required checks, Claude's review among them).
# GitHub's recipe: docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions
on: pull_request
concurrency:   # one run per PR; a new push cancels the one in progress
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  auto-merge:
    name: Auto-merge
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # as the bot App: a merge GITHUB_TOKEN turned on starts no push workflow on main (Checks, which deploys). Its key
      # is a Dependabot secret too (CONTRIBUTING.md), since Dependabot's runs see no Actions secret
      - name: Mint the bot App's token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510   # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write   # the squash merge
          permission-pull-requests: write
          permission-workflows: write   # an actions bump edits workflow files
      - name: Turn on auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
