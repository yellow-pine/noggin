<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noggin</title>
<!-- the one viewer, pinned (docs/adr/0008); it only displays Blender's glTF -->
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.4.0/dist/model-viewer.min.js"
  integrity="sha384-wjsPzEO+lXOf7d9csIDfAQpPt2OKuUU3m0K9qsdKIuzX4N8czSF6hdh23eAbZa3p" crossorigin="anonymous"></script>
<style>
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; background: #F7F4EE; color: #222; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  model-viewer { width: 100%; height: 70vh; background: #F7F4EE; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  button { font: inherit; padding: 6px 12px; border: 1px solid #888; border-radius: 6px; background: #fff; cursor: pointer; }
  button[aria-pressed="true"] { background: #222; color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
<main>
  <h1>noggin</h1>
  <p>The Mech that reacts to Claude Code, as built in <a href="https://github.com/yellow-pine/noggin">its model</a>. Drag to turn it, scroll or pinch to zoom.</p>
  <nav aria-label="Stage">
    <button data-src="stage1.glb" aria-pressed="false">Stage 1</button>
    <button data-src="stage2.glb" aria-pressed="false">Stage 2</button>
    <button data-src="stage3.glb" aria-pressed="true">Stage 3</button>
  </nav>
  <model-viewer src="stage3.glb" alt="The noggin Mech, rendered from its model" camera-controls autoplay animation-name="hero"></model-viewer>
  <nav aria-label="Gesture">
    <button data-gesture="hero">hero</button>
    <button data-gesture="eureka">eureka</button>
    <button data-gesture="attention">attention</button>
    <button data-gesture="bored">bored</button>
    <button data-gesture="wince">wince</button>
    <button data-gesture="wink">wink</button>
    <button data-gesture="thinking">thinking</button>
  </nav>
</main>
<script type="module">
  const viewer = document.querySelector("model-viewer");
  const stages = document.querySelectorAll("[data-src]");
  const gestures = document.querySelectorAll("[data-gesture]");
  // a gesture plays once, then the hero loops again; the hero is the model's default (autoplay)
  const play = (name) => {
    viewer.animationName = name;
    viewer.play(name === "hero" ? {} : { repetitions: 1 });
  };
  const hasHero = () => viewer.availableAnimations.includes("hero");
  viewer.addEventListener("finished", () => hasHero() && play("hero"));
  // only what this Stage's GLB carries can play; Stage 1 has no neck, so no hero: it rests until a gesture
  viewer.addEventListener("load", () => {
    for (const b of gestures) b.disabled = !viewer.availableAnimations.includes(b.dataset.gesture);
    if (!hasHero()) {
      viewer.pause();
      viewer.currentTime = 0;
    }
  });
  for (const b of stages) b.addEventListener("click", () => {
    for (const s of stages) s.setAttribute("aria-pressed", s === b);
    viewer.animationName = "hero";  // the new Stage keeps the name and would loop a gesture
    viewer.src = b.dataset.src;
  });
  for (const b of gestures) b.addEventListener("click", () => play(b.dataset.gesture));
</script>
</body>
</html>
