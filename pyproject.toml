[project]
name = "noggin"
version = "0.1.0"
description = "Animatronic CyberBrick head that reacts to Claude Code"
requires-python = ">=3.12"
dependencies = ["pyserial>=3.5"]

[dependency-groups]
dev = [
    "pytest>=8",
    "mpremote>=1.24",
    "ruff>=0.17.3",
    "pyright>=1.1.414",
]

[tool.pytest.ini_options]
testpaths = ["eyes", "reactions", "noggin", "test_vocabulary.py"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["eyes/gaze_trace.py", "eyes/stock-backup"]  # generated trace bytes / Bambu's stock program

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
