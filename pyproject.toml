[project]
name = "noggin"
version = "0.1.0"
description = "Animatronic Mech that reacts to Claude Code"
requires-python = ">=3.14"
dependencies = [
    "cadquery>=2.8.0",
    "coacd>=1.0.14",
    "mujoco>=3.17.0",
    "numpy>=2.5.4",
    "pyserial>=3.5",
    "scipy>=1.18.1",
    "spicelib>=1.6.4",
    "trimesh>=5.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "mpremote>=1.24",
    "ruff>=0.17.3",
    "pyright>=1.1.414",
    "micropython-esp32-esp32_generic_c3-stubs==1.23.*",  # the Core's MicroPython ([tool.noggin]): pyright on its files
    "micropython-stdlib-stubs==1.23.*",
    "mpy-cross==1.23.*",  # .mpy for the Core: mpy v6.3, what its 1.23 loads
    "pytest-xdist==3.8.0",
    "imageio-ffmpeg>=0.7.0",
]

[tool.noggin]
micropython = "1.23"  # the Core's firmware (sys.implementation._mpy 774); the stubs and mpy-cross above pin the same

[tool.pytest.ini_options]
testpaths = ["ci", "eyes", "reactions", "noggin", "model", "scripts", "web", "test_vocabulary.py", "test_site.py", "test_derived.py", "test_workflows.py"]
markers = ["model: MuJoCo and the slowest mesh sweeps; CI runs them in its Model job (-m model) beside the rest"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["eyes/gaze_trace.py", "eyes/stock-backup"]  # generated trace bytes / the stock program

# no 3.14 syntax (ruff format drops except parens) where our venv doesn't run them: the Core's MicroPython
# (eyes/test_micropython.py), the stand-in's, and the runner's python3 in .github/workflows
[tool.ruff.per-file-target-version]
"eyes/boot.py" = "py312"
"eyes/eyes.py" = "py312"
"eyes/wifi.py" = "py312"
"mech/core/*.py" = "py312"
"noggin/core.py" = "py312"
"scripts/blender_pin.py" = "py312"
"scripts/ci_budget.py" = "py312"
"scripts/claude_approved.py" = "py312"
"scripts/deploy_status.py" = "py312"
"scripts/pr_scopes.py" = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"eyes/eyes.py" = ["B905"]  # MicroPython zip() has no strict=
"model/*.py" = ["E501", "B905", "UP031", "E741", "E731", "B023"]  # the model's long table lines and numeric zips; tightening them is its own change

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.14"  # the venv's (requires-python); else pyright asks whichever python is on PATH
include = ["eyes", "noggin", "reactions", "scripts", "mech", "conftest.py", "test_vocabulary.py"]
exclude = ["eyes/stock-backup", "eyes/boot.py", "eyes/eyes.py", "eyes/gaze_trace.py", "eyes/wifi.py", "mech/core", "mech/build"]  # the Core's (eyes/test_micropython.py checks them against its MicroPython), the stand-in's MicroPython stubs, its build
extraPaths = ["eyes"]  # conftest puts eyes/ on sys.path: `import eyes` is eyes/eyes.py, the Core program
venvPath = "."
venv = ".venv"
reportMissingModuleSource = false  # pyserial ships no stubs
