[project]
name = "noggin"
version = "0.1.0"
description = "Animatronic CyberBrick head that reacts to Claude Code"
requires-python = ">=3.12"
dependencies = ["pyserial>=3.5"]

[dependency-groups]
dev = ["pytest>=8", "mpremote>=1.24"]

[tool.pytest.ini_options]
testpaths = ["eyes", "reactions", "noggin", "model", "scripts", "test_vocabulary.py"]
