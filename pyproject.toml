[project]
name = "noggin"
version = "0.0.0"  # a placeholder: the git tag is the version (noggin/core.py, docs/adr/0017)
description = "Animatronic Mech that reacts to Claude Code"
requires-python = ">=3.14"
dependencies = [
    "cadquery>=2.8.0",
    "coacd>=1.0.14",
    "magpylib>=6.0.0",
    "mujoco[sysid]>=3.17.0",  # sysid: model/servo_fit.py
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pyserial>=3.5",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "spicelib>=1.6.4",
    "trimesh>=5.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "mpremote>=1.24",
    "ruff>=0.17.3",
    "pyright>=1.1.414",
    "micropython-esp32-esp32_generic_c3-stubs==1.23.*",  # the Core's MicroPython ([tool.noggin]): pyright on its files
    "micropython-stdlib-stubs==1.23.*",
    "mpy-cross==1.23.*",  # .mpy for the Core: mpy v6.3, what its 1.23 loads
    "pytest-xdist==3.8.0",
    "pytest-split>=0.11.0",  # --store-durations: the model shards' measured seconds (model/shards.py)
    "imageio-ffmpeg>=0.7.0",
    "zizmor>=1.31.1",
    "actionlint-py>=1.7.12.25",
    "hadolint-bin>=2.15.1",
    "rust-just>=1.59.0",  # just runs the recipes (justfile, docs/adr/0016)
    "pytest-timeout>=2.4.0",  # CI's 60 s a test (--timeout, checks.yml and pr-gate.yml, #808, #945)
]

[tool.uv]
required-version = ">=0.13.1"  # older uvs cannot install .python-version's Python: "No interpreter found" (#431)

[tool.noggin]
micropython = "1.23"  # the Core's firmware (sys.implementation._mpy 774); the stubs and mpy-cross above pin the same

[tool.pytest.ini_options]
testpaths = [".claude/hooks", "ci", "eyes", "reactions", "noggin", "model", "scripts", "web", "test_vocabulary.py", "test_site.py", "test_derived.py", "test_workflows.py"]
markers = [
    "model: MuJoCo, our parts' STLs (just ours) and the CadQuery sweeps; CI runs them in its Model shards (-m model), just check-light leaves them out",
    "bones: reads the realistic Skeleton's finished bones (Blender's, just ours): skipped where Blender is missing (#936)",
]
# CI's --timeout (60 s, #808, #945) times the test itself: the parts a module's tests share are built once a worker, in a
# fixture, whose seconds the slowest-20 list still shows as setup
timeout_func_only = true

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["eyes/gaze_trace.py", "eyes/stock-backup"]  # generated trace bytes / the stock program

# no 3.14 syntax (ruff format drops except parens) where our venv doesn't run them: the Core's MicroPython
# (eyes/test_micropython.py), the stand-in's, and the runner's python3 in .github/workflows
[tool.ruff.per-file-target-version]
".claude/hooks/sync_checkout.py" = "py39"  # the Mac's python3 runs Claude Code's hooks
"eyes/boot.py" = "py312"
"eyes/eyes.py" = "py312"
"eyes/wifi.py" = "py312"
"mech/core/*.py" = "py312"
"noggin/core.py" = "py312"
"scripts/blender_pin.py" = "py312"
"scripts/claude_approved.py" = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# S101: pytest's checks and our self-checks are asserts, never run under -O; S603/S607: subprocess runs our own tools
# (git, gh, uv, Blender) found on PATH, with argument lists, never a shell
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"eyes/eyes.py" = ["B905"]  # MicroPython zip() has no strict=
"model/*.py" = ["E501", "B905", "UP031", "E741", "E731", "B023"]  # the model's long table lines and numeric zips; tightening them is its own change

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.14"  # the venv's (requires-python); else pyright asks whichever python is on PATH
include = [".claude/hooks", "eyes", "noggin", "reactions", "scripts", "mech", "conftest.py", "test_vocabulary.py"]
exclude = ["eyes/stock-backup", "eyes/boot.py", "eyes/eyes.py", "eyes/gaze_trace.py", "eyes/wifi.py", "mech/core", "mech/build"]  # the Core's (eyes/test_micropython.py checks them against its MicroPython), the stand-in's MicroPython stubs, its build
extraPaths = ["eyes"]  # conftest puts eyes/ on sys.path: `import eyes` is eyes/eyes.py, the Core program
venvPath = "."
venv = ".venv"
reportMissingModuleSource = false  # pyserial ships no stubs
